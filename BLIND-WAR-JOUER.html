onale ; ne tire pas dans la même action ; autorisé pendant la recharge).",attackSummary:"Tir d’arbalète à distance de 1 à 3 cases dans les 8 directions, en ligne dégagée, sans déplacer l’Arbalétrier.",specialAbility:"Tir à distance & Cadence stricte (1 tir / 3 tours personnels) : après un tir (Tour 1), l’Arbalétrier est indisponible au Tour 2 et au Tour 3 de son propriétaire, puis redevient disponible au Tour 4. Les tours adverses ne font jamais avancer cette recharge. Peut viser une pièce inconnue sans la révéler si le tir est bloqué !",interactionsSummary:["Colosse : le Tir d’arbalète ne peut JAMAIS éliminer le Colosse (même sous Double Action) ; si le Colosse était caché, son identité reste secrète après un tir bloqué.","Protection / Invincibilité : la Protection absorbe le tir et se brise ; l’Invincibilité bloque le tir ; tout tir effectué déclenche le délai de recharge de 3 tours personnels.","Kamikaze : si une cible possédant Kamikaze est éliminée par un tir, l’explosion emporte l’Arbalétrier à distance (sauf s’il porte Protection).","Guetteurs : peuvent révéler la cible sur la ligne de tir sans modifier ni la portée (3 cases) ni la cadence de 3 tours.","Téléportation / Double Action / Block : Téléportation ne réinitialise jamais le temps de recharge, Double Action n’autorise jamais 2 tirs dans le même tour, et les tours adverses ne réduisent pas la recharge."],restrictions:["Ne se déplace jamais en diagonale (seul le tir vise en diagonale).","Ne peut pas tirer à travers une pièce alliée ou ennemie.","Impossible de tirer et de bouger dans la même action ; se déplacer reste possible pendant la récupération.","Ne peut jamais avoir 2 Arbalétriers simultanément en jeu."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:-2,dCol:0,kind:"shoot"},{dRow:-3,dCol:0,kind:"shoot"},{dRow:2,dCol:0,kind:"shoot"},{dRow:3,dCol:0,kind:"shoot"},{dRow:0,dCol:-2,kind:"shoot"},{dRow:0,dCol:-3,kind:"shoot"},{dRow:0,dCol:2,kind:"shoot"},{dRow:0,dCol:3,kind:"shoot"},{dRow:-1,dCol:-1,kind:"shoot"},{dRow:-2,dCol:-2,kind:"shoot"},{dRow:-3,dCol:-3,kind:"shoot"},{dRow:-1,dCol:1,kind:"shoot"},{dRow:-2,dCol:2,kind:"shoot"},{dRow:-3,dCol:3,kind:"shoot"},{dRow:1,dCol:-1,kind:"shoot"},{dRow:2,dCol:-2,kind:"shoot"},{dRow:3,dCol:-3,kind:"shoot"},{dRow:1,dCol:1,kind:"shoot"},{dRow:2,dCol:2,kind:"shoot"},{dRow:3,dCol:3,kind:"shoot"}]},soldat:{id:"soldat",name:tt.soldat.name,symbol:"SO",roleSummary:tt.soldat.roleSummary,initialQuantity:fe.soldat,maxBoardCapLabel:`${fe.soldat} au départ (recrutable)`,movementSummary:"Avance d’1 case vers le camp adverse : tout droit (case libre uniquement) ou en diagonale avant gauche/droite.",attackSummary:"Élimine uniquement en diagonale avant (ne peut jamais éliminer tout droit).",specialAbility:"Promotion : en atteignant la dernière rangée adverse, est promu au choix (Guetteur H/D, Assassin, Cavalier, Berserker, ou Reine / Colosse / Traqueur / Exécuteur / Arbalétrier si votre exemplaire unique est déjà éliminé).",interactionsSummary:["Respecte le plafond strict de 1 exemplaire en jeu pour Reine, Colosse, Traqueur, Exécuteur et Arbalétrier.",`Un plateau complet démarre toujours à ${du} pièces par camp.`],restrictions:["Ne peut jamais reculer (sauf carte Retreat).","Ne peut jamais être promu en Roi."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_only"},{dRow:-1,dCol:-1,kind:"move_and_attack"},{dRow:-1,dCol:1,kind:"move_and_attack"}]}},br={kamikaze:{id:"kamikaze",name:ct.kamikaze.name,badge:"💥",durationLabel:"Permanent jusqu’à élimination",visibilityLabel:"Adversaire averti de la carte, pion cible secret",effectDescription:ct.kamikaze.description,restrictions:["Interdit sur le Roi et sur le Colosse.",`Un Colosse survit au 1er déclenchement Kamikaze qu’il provoque (1/${dt}) et est éliminé au ${dt}e (${dt}/${dt}).`,"Les déclenchements Kamikaze provoqués par d’autres pièces ne comptent jamais dans le compteur du Colosse.","S’applique également contre Traqueur, Exécuteur (Frappe traversante incluse) et Arbalétrier à distance.","Une pièce attaquante protégée par Protection absorbe l’explosion Kamikaze en brisant sa Protection.","Si un Assassin meurt par Kamikaze, sa révélation permanente ne se déclenche pas."]},invincibilite:{id:"invincibilite",name:ct.invincibilite.name,badge:"🛡️",durationLabel:"1 tour complet",visibilityLabel:"Adversaire averti de la carte, pion cible secret",effectDescription:ct.invincibilite.description,restrictions:["Interdit sur le Roi et sur le Colosse.","Bloque toute attaque directe, saut de Cavalier, Frappe traversante ou Tir d’arbalète pendant 1 tour complet.","Aucune capacité spéciale (y compris l’Exécuteur ou le Traqueur) ne contourne l’Invincibilité."]},block:{id:"block",name:ct.block.name,badge:"⛓️",durationLabel:"1 tour adverse sauté",visibilityLabel:"Effet annoncé publiquement",effectDescription:ct.block.description,restrictions:["Temps de recharge (cooldown) de 2 tours avant de pouvoir rejouer Block.","Empêche également le Traqueur ou l’Arbalétrier adverse d’agir pendant le tour sauté ; votre propre tour suivant progresse normalement."]},retreat:{id:"retreat",name:ct.retreat.name,badge:"↩️",durationLabel:"Immédiat",visibilityLabel:"Déplacement visible",effectDescription:ct.retreat.description,restrictions:["Permet aux pièces ne pouvant normalement pas reculer (Soldat, Colosse) de reculer d’1 case (y compris Traqueur, Exécuteur, Arbalétrier).","L’élimination en reculant doit respecter les immunités (Colosse, Invincibilité) et le seuil Kamikaze du Colosse (2 déclenchements)."]},revelation_temporaire:{id:"revelation_temporaire",name:ct.revelation_temporaire.name,badge:"👁️",durationLabel:"1 tour complet (jusqu’à votre prochain tour)",visibilityLabel:"Cible secrète",effectDescription:ct.revelation_temporaire.description,restrictions:["Bloquée par Brouillard et Contre-espionnage.","Permet au Traqueur de marquer la pièce révélée, mais le marquage disparaît dès que la révélation temporaire expire."]},revelation_permanente:{id:"revelation_permanente",name:ct.revelation_permanente.name,badge:"🔍",durationLabel:"Jusqu’à la fin de la partie",visibilityLabel:"Cible secrète",effectDescription:ct.revelation_permanente.description,restrictions:["Ne peut jamais être annulée par Brouillard ni Contre-espionnage.","Une pièce révélée définitivement reste éligible au Marquage du Traqueur (tant que la ligne orthogonale 1–4 est dégagée)."]},resurrection:{id:"resurrection",name:ct.resurrection.name,badge:"✨",durationLabel:"Immédiat",visibilityLabel:"Apparition visible en 1re rangée",effectDescription:ct.resurrection.description,restrictions:["Interdit sur le Roi, la Reine et le Colosse.","Autorisée sur Traqueur, Exécuteur et Arbalétrier uniquement s’il n’en existe pas déjà 1 exemplaire vivant sur le plateau (plafond strict de 1).","La case d’apparition sur la première rangée doit être libre.","Une pièce promue avant son élimination conserve son rôle promu à la résurrection (et réinitialise marquage / récupération)."]},brouillard:{id:"brouillard",name:ct.brouillard.name,badge:"🌫️",durationLabel:"3 tours complets",visibilityLabel:"Actif sur toute votre armée",effectDescription:ct.brouillard.description,restrictions:["Bloque les Guetteurs H/D adverses, Révélation temporaire et Espionnage.","Empêche le Traqueur adverse de marquer vos pièces cachées et fait immédiatement disparaître tout marquage qui reposait sur une révélation temporaire ou un Guetteur.","N’annule pas les révélations permanentes déjà acquises ni celles de l’Assassin."]},espionnage:{id:"espionnage",name:ct.espionnage.name,badge:"📡",durationLabel:"3 tours complets",visibilityLabel:"Adversaire averti de la carte, pions cibles secrets",effectDescription:ct.espionnage.description,restrictions:["Traverse Contre-espionnage, mais reste bloqué par Brouillard.","Tant qu’Espionnage révèle une pièce ennemie, le Traqueur peut la marquer."]},teleportation:{id:"teleportation",name:ct.teleportation.name,badge:"⚡",durationLabel:"Immédiat",visibilityLabel:"Déplacement visible",effectDescription:ct.teleportation.description,restrictions:["Utilisable sur Traqueur, Exécuteur et Arbalétrier en respectant leurs directions autorisées (sans traverser d’obstacle ni capturer).","Ne réinitialise jamais le temps de récupération du tir de l’Arbalétrier et ne déclenche ni tir, ni Frappe traversante, ni Poursuite automatique."]},protection:{id:"protection",name:ct.protection.name,badge:"🔰",durationLabel:"Permanent jusqu’au 1er coup subi",visibilityLabel:"Cible secrète pour l’adversaire",effectDescription:ct.protection.description,restrictions:["Interdit sur le Roi et sur le Colosse.","Bloque une attaque directe, un saut de Cavalier, une Frappe traversante, un Tir d’arbalète ou une explosion Kamikaze, puis disparaît.","N’interagit pas avec les révélations d’identité ni avec le marquage du Traqueur."]},recrutement:{id:"recrutement",name:ct.recrutement.name,badge:"📯",durationLabel:"Immédiat (1 fois max par partie)",visibilityLabel:"Apparition visible en 1re rangée",effectDescription:ct.recrutement.description,restrictions:["Réservée strictement au Soldat (jamais utilisable sur Traqueur, Exécuteur ou Arbalétrier)."]},double_action:{id:"double_action",name:ct.double_action.name,badge:"⏩",durationLabel:"Ce tour (2 actions immédiates)",visibilityLabel:"Effet annoncé",effectDescription:ct.double_action.description,restrictions:["Interdit de jouer une 2e carte pendant les 2 actions.","Ne contourne pas la récupération du tir de l’Arbalétrier (1 tir max par séquence, même sous Double Action).","Ne permet ni d’ignorer les immunités du Colosse ni de doubler automatiquement les capacités spéciales au-delà de leurs conditions normales."]},piege:{id:"piege",name:ct.piege.name,badge:"🕸️",durationLabel:"Reste posé jusqu’au déclenchement ; immobilise 1 tour",visibilityLabel:"Adversaire averti de la pose, case secrète",effectDescription:ct.piege.description,restrictions:["Une fois posé sur une case libre, affecte les pièces des DEUX camps (y compris Traqueur, Exécuteur et Arbalétrier s’ils s’y déplacent) !","La Frappe traversante et le Tir d’arbalète ne déplacent pas l’attaquant sur la case cible."]},contre_espionnage:{id:"contre_espionnage",name:ct.contre_espionnage.name,badge:"🕶️",durationLabel:"3 tours complets",visibilityLabel:"Cible secrète pour l’adversaire",effectDescription:ct.contre_espionnage.description,restrictions:["Bloque Révélation temporaire et les Guetteurs (ce qui retire également le marquage du Traqueur si la pièce redevient cachée).","Ne bloque pas Espionnage, Révélation permanente ni la capacité de l’Assassin."]},sacrifice:{id:"sacrifice",name:ct.sacrifice.name,badge:"🩸",durationLabel:"Immédiat",visibilityLabel:"Annoncé à l’adversaire",effectDescription:ct.sacrifice.description,restrictions:["Réservée strictement au Soldat (jamais utilisable sur Traqueur, Exécuteur ou Arbalétrier).","Utilisable même avec 3 cartes en main et ne donne aucun point de pioche à l’adversaire."]}},el=[{id:"concept",title:"1. Plateau 9×9, Nouvelle Composition (27 Pièces) & Préparation",summary:`Deux armées identiques de ${du} pièces (Rouge et Noir) s’affrontent sur 81 cases. Rouge commence toujours.`,bullets:[`Composition officielle (${du} pièces) : 1 Roi, 1 Reine, 1 Colosse, ${fe.cavalier} Cavaliers, ${fe.berserker} Berserker, ${fe.assassin} Assassins, ${fe.guetteur_h} Guetteurs H, ${fe.guetteur_d} Guetteurs D, ${fe.traqueur} Traqueur, ${fe.executeur} Exécuteur, ${fe.arbaletrier} Arbalétrier, ${fe.soldat} Soldats.`,"Placement libre sur vos 3 premières rangées en 90 s (complétion automatique si temps écoulé) ; pendule de 10 minutes par joueur.","Reine, Colosse, Traqueur, Exécuteur et Arbalétrier sont chacun limités strictement à 1 exemplaire vivant maximum sur le plateau (y compris après Promotion ou Résurrection).","Apparence personnalisable : par défaut en Rouge et Noir, chaque camp conserve une palette claire ou sombre nettement différenciée sur fond 100 % transparent et automatiquement adaptée au thème sélectionné, sans jamais révéler d’identité cachée."]},{id:"visibility",title:"2. Identités Cachées, Révélations, Guetteurs, Traqueur & Arbalétrier",summary:"Les positions sont publiques, mais l’identité des pièces adverses reste cachée par défaut et jamais divulguée indûment.",bullets:["Guetteurs H (3/camp : bougent en diagonale, détectent H/V) et Guetteurs D (3/camp : bougent H/V, détectent en diagonale) révèlent temporairement les ennemis à 1 case ; s’ils détectent une cible sur la ligne de l’Arbalétrier, son identité devient visible sans augmenter portée ni cadence.","Traqueur & révélations : le Traqueur possède une portée standard de 1–2 cases et ne peut marquer qu’une pièce ennemie DÉJÀ révélée (Guetteur, Révélation temporaire/permanente, Espionnage, Colosse révélé) à 1–4 cases orthogonales dégagées pour étendre sa Poursuite jusqu’à 4 cases. Si la cible redevient inconnue (Brouillard, Contre-espionnage, expiration), le marquage disparaît immédiatement.","Arbalétrier & cibles inconnues : l’Arbalétrier peut tirer sur une pièce ennemie cachée, mais un tir bloqué (Colosse, Invincibilité, Protection) ne révèle jamais son identité ; si elle est éliminée inconnue, le cimetière affiche « Pièce éliminée ».","L’Assassin révèle définitivement chaque pièce qu’il élimine (sauf s’il meurt simultanément par Kamikaze)."]},{id:"colosse-et-specials",title:"3. Règles Officielles du Colosse, Kamikaze (2/2) & Capacités Spéciales",summary:`Le Colosse possède une immunité renforcée mise à jour avec la règle définitive des ${dt} déclenchements Kamikaze et la Frappe traversante.`,bullets:[`Kamikaze contre Colosse : le Colosse survit au 1er déclenchement Kamikaze qu’il provoque (1/${dt}) et est ÉLIMINÉ au ${dt}e (${dt}/${dt}). Les déclenchements Kamikaze provoqués par d’autres pièces ne comptent pas.`,"Attaques contre le Colosse : Roi, Reine et autre Colosse l’éliminent normalement ; la Frappe traversante de l’Exécuteur peut l’éliminer s’il est visé derrière une autre pièce ennemie non-Colosse ; le Tir d’arbalète et toutes les attaques normales (y compris Poursuite du Traqueur et Bond/Saut du Cavalier) ne peuvent JAMAIS l’éliminer.","Frappe traversante (Exécuteur) : sur [Exécuteur, Ennemi 1, Ennemi 2] alignés H/V (Ennemi 1 ≠ Colosse), l’Exécuteur reste sur sa case et choisit Ennemi 1 (attaque normale) ou Ennemi 2 (Frappe traversante, Ennemi 1 reste intact).","Tir d’arbalète & recharge (1 tir / 3 tours) : 1 à 3 cases dans les 8 directions en ligne dégagée, ne déplace pas l’Arbalétrier, puis temps de recharge de 2 tours personnels d’attente (Tour 1 tir → Tour 2 attente → Tour 3 attente → Tour 4 prêt ; non réinitialisé par Téléportation ; non contourné par Double Action).","Cavalier reworké (Bond en « L » & Percée) : effectue soit un pas orthogonal d’1 case (H/V), soit un Bond en « L » (2×1) sautant par-dessus toute pièce ou piège intermédiaire, soit un Saut Percée style dames en chaîne par-dessus un ennemi adjacent."]},{id:"cards-and-turns",title:"4. Nouvelle Gestion des Tours, Cartes & Fin de Partie",summary:"0 ou 1 élimination = 1 action pour l’adversaire. 2+ éliminations dans un tour = Tour Bonus immédiat (1 déplacement, sans carte). Toutes les 3 éliminations ennemies, vous piochez 1 carte aléatoire (3 max en main).",bullets:["Gestion des tours unifiée (sans pénalité) : aucune pièce n’offre plus 2 actions gratuites à l’adversaire en cas d’échec (l’ancienne pénalité à 0 élimination du Cavalier est supprimée).","Tour Bonus (2+ éliminations) : toute action ou combinaison d’actions dans un même tour éliminant au moins 2 pièces ennemies réelles accorde immédiatement un Tour Bonus d’1 seul déplacement sans carte (une attaque bloquée ou annulée ne compte jamais).","Kamikaze, Protection et Invincibilité sont strictement interdits sur le Roi et sur le Colosse ; Protection/Invincibilité bloquent aussi Frappe traversante et Tir d’arbalète.","Double Action accorde 2 actions consécutives dans ce tour (sans 2e carte ni 2e tir d’Arbalétrier) ; Téléportation respecte les directions de chaque pion.","Victoire immédiate par élimination du Roi adverse (y compris par Frappe traversante ou Tir d’arbalète), pendule à 0:00, abandon ou déconnexion > 60 s.","Match nul par accord mutuel, Pat (aucun coup ni carte jouable) ou 5 répétitions (avertissement à 3 répétitions)."]}],bv=[{id:"gestion-tours-bonus",title:"Gestion des Tours (0 = 1, 1 = 1, 2+ = Tour Bonus)",badge:"⚡",category:"Gestion des tours",summary:"La pénalité du Cavalier est supprimée. Le rythme des tours dépend désormais uniquement du nombre réel d’éliminations ennemies obtenues dans votre tour.",rules:["0 élimination réelle dans le tour : l’adversaire reçoit normalement 1 action à son tour.","1 élimination réelle dans le tour : l’adversaire reçoit normalement 1 action à son tour.","2 éliminations réelles ou plus dans un même tour (saut en chaîne, Double Action, combo) : vous obtenez immédiatement un Tour Bonus composé uniquement d’1 déplacement, sans carte autorisée."],edgeCases:["Une élimination bloquée par Protection, Invincibilité ou immunité du Colosse n’est pas comptabilisée.","Sacrifier son propre Soldat (carte Sacrifice) ou subir une riposte Kamikaze ne compte jamais comme une élimination vers votre Tour Bonus.","Un Tour Bonus ne peut jamais enchaîner un deuxième Tour Bonus."]},{id:"cavalier-rework",title:"Rework du Cavalier (Bond en « L » & Percée en Chaîne)",badge:"CAV",relatedCharacter:"cavalier",category:"Cavalier",summary:"Le Cavalier quitte son rôle rigide de pion lent puni à 0 élimination pour devenir une pièce d’infiltration agile capable de contourner le front en « L » ou de percer en chaîne.",rules:["Bond en « L » : se déplace ou attaque en L (2 cases sur un axe + 1 case perpendiculaire) en sautant par-dessus alliés, ennemis, Colosse et pièges intermédiaires.","Pas de mêlée : peut aussi avancer ou capturer à 1 case horizontale/verticale (H/V), mais pas à 1 case en diagonale.","Percée (Saut style dames) : peut toujours sauter par-dessus un ennemi adjacent vers la case libre située derrière lui, avec enchaînement facultatif (et déclencher le Tour Bonus à 2+ éliminations)."],edgeCases:["Aucune pénalité en cas de 0 élimination : déplacer un Cavalier sans capturer rend toujours 1 action normale à l’adversaire.","Un Piège posé sur la case d’arrivée d’un Bond en « L » s’active normalement ; les cases survolées sont ignorées.","Ne peut ni s’arrêter sur une case alliée ni éliminer un Colosse (il peut toutefois passer par-dessus un Colosse lors d’un Bond en « L »)."]},{id:"frappe-traversante",title:"Frappe traversante (Exécuteur)",badge:"EXE",relatedCharacter:"executeur",category:"Exécuteur",summary:"Permet à l’Exécuteur d’abattre une pièce ennemie située à 2 cases derrière un premier ennemi aligné H/V, en choisissant librement sa cible.",rules:["Alignement horizontal ou vertical obligatoire sur exactement 2 cases : [Exécuteur] → [Ennemi 1] → [Ennemi 2].","L’Exécuteur reste sur sa case de départ et élimine Ennemi 2 à travers la ligne ; Ennemi 1 reste intact.","Si vous préférez abattre Ennemi 1, sélectionnez simplement la case à 1 case (attaque normale).","Seule capacité spéciale autorisée à éliminer le Colosse (lorsqu’il est la cible arrière Ennemi 2)."],edgeCases:["Impossible à travers une pièce alliée, à travers 2 pièces, ou si Ennemi 1 est un Colosse (un Colosse intermédiaire caché interrompt la frappe et est révélé temporairement).","Si Ennemi 1 est le Roi adverse, frapper Ennemi 2 laisse le Roi intact ; choisir directement le Roi gagne immédiatement la partie.","Respecte Protection, Invincibilité et Kamikaze (si Ennemi 2 explose en Kamikaze, l’Exécuteur est emporté sauf Protection)."]},{id:"marquage-poursuite",title:"Marquage & Poursuite (Traqueur — Guide Détaillé)",badge:"TRQ",relatedCharacter:"traqueur",category:"Traqueur",summary:"Portée de base de 2 cases H/V ; cibler gratuitement (0 coût) un ennemi déjà révélé sur l’échiquier étend la Poursuite jusqu’à 4 cases vers cette cible.",rules:["Objectif & Conditions : ciblez une pièce ennemie DÉJÀ révélée (Guetteur H/D, Espionnage, Révélation temporaire/permanente, Colosse révélé) située à 1–4 cases orthogonales en ligne dégagée (aucune pièce inconnue « ? »).","Activation sur l’échiquier : sélectionnez le Traqueur → cliquez sur « Cibler (0 PA) » → cliquez directement sur l’ennemi révélé sur l’échiquier (alignement H/V, 1–4 cases).","Déplacements & Bonus Poursuite : normalement 1–2 cases H/V. Dès que la cible est traquée (et tant que la marque reste valide), votre portée vers elle monte jusqu’à 4 cases H/V.","Exemple concret : votre Guetteur révèle un Assassin adverse à 4 cases de votre Traqueur en ligne dégagée. Vous cliquez « Cibler » puis cliquez l’Assassin sur l’échiquier (0 action) : votre Traqueur peut maintenant bondir jusqu’à 4 cases pour l’éliminer !"],edgeCases:["Limites strictes : une seule cible marquée maximum ; à distance 3 ou 4, impossible d’éliminer une autre pièce que la cible marquée.","Durée & Fin d’effet : persiste tant que la cible est en vie et identifiable ; consomme le bonus quand vous effectuez un déplacement de 3 ou 4 cases (un déplacement de 1–2 cases conserve le marquage).","Disparition immédiate : si la cible meurt ou redevient cachée (expiration de Révélation temporaire/Espionnage, sortie d’un Guetteur, Brouillard, Contre-espionnage), le marquage disparaît.","Colosse & Cartes : le Colosse révélé peut être marqué pour se rapprocher rapidement, mais la Poursuite ne l’élimine jamais ; respecte Protection, Invincibilité et Kamikaze ; Téléportation n’annule pas le marquage."]},{id:"tir-arbalete",title:"Tir d’arbalète (Arbalétrier)",badge:"ARB",relatedCharacter:"arbaletrier",category:"Arbalétrier",summary:"Attaque à distance sur 1 à 3 cases dans les 8 directions, avec ligne de vue dégagée, sans déplacer l’Arbalétrier.",rules:["Portée : 1, 2 ou 3 cases horizontalement, verticalement ou en diagonale, sans aucune pièce sur les cases intermédiaires.","Action complète : tirer consomme votre action du tour (impossible de bouger et tirer dans la même action).","Cible inconnue autorisée : le tir peut viser une pièce ennemie cachée (« ? ») ; si elle est éliminée, le cimetière affiche « Pièce éliminée »."],edgeCases:["Si une pièce se trouve à 1 case orthogonale (adjacente), l’interface vous permet de choisir entre Capture au corps à corps (déplacement) et Tir d’arbalète à distance (reste sur place).","Un tir bloqué par Protection, Invincibilité ou Colosse ne révèle JAMAIS l’identité d’une cible inconnue."]},{id:"recuperation-tir",title:"Recharge du Tir de l’Arbalétrier (1 tir / 3 tours personnels)",badge:"ARB",relatedCharacter:"arbaletrier",category:"Arbalétrier",summary:"Après chaque tir (réussi ou bloqué), l’Arbalétrier ne peut tirer qu’une fois tous les 3 tours de son propriétaire : 2 tours personnels d’attente obligatoires avant le prochain tir.",rules:["Cycle exact : Tour 1 (Disponible → vous tirez) → Tour 2 (Indisponible : 2 tours restants) → Tour 3 (Indisponible : 1 tour restant) → Tour 4 (Disponible à nouveau !).","Les tours de l’adversaire ne font jamais avancer ce délai ; seul le déplacement normal d’1 case H/V reste autorisé pendant la recharge.","Le délai s’applique même si le tir a été bloqué par Invincibilité, Protection ou un Colosse."],edgeCases:["Double Action : ne permet jamais de tirer deux fois ni de contourner la recharge (la 2e action sert à bouger l’Arbalétrier ou une autre pièce).","Téléportation & Block : Téléportation ne réinitialise jamais le temps de recharge ; l’état de recharge est strictement géré côté serveur et restauré après reconnexion."]},{id:"interactions-colosse",title:"Interactions avec le Colosse",badge:"CO",relatedCharacter:"colosse",category:"Colosse & Kamikaze",summary:"Récapitulatif officiel de toutes les capacités spéciales face à l’immunité du Colosse.",rules:["Éliminations directes autorisées : Roi, Reine, autre Colosse et Frappe traversante de l’Exécuteur (lorsque ker peut immédiatement glisser de 1–2 cases H/V vers une case libre.",rows:5,cols:5,pieces:[{row:2,col:1,kind:"berserker",owner:"red"},{row:2,col:3,kind:"secret",owner:"black"}],highlights:[{row:2,col:1,kind:"selected"},{row:2,col:3,kind:"attack",tag:"Capture"},{row:0,col:3,kind:"move",tag:"Rage"},{row:1,col:3,kind:"move",tag:"Rage"},{row:2,col:2,kind:"move",tag:"Rage"}],arrows:[{from:{row:2,col:1},to:{row:2,col:3},kind:"attack"},{from:{row:2,col:3},to:{row:0,col:3},kind:"move"}]}]},assassin:{id:"assassin",name:"Assassin",initialQuantity:fe.assassin,maxBoardCapLabel:`${fe.assassin} au départ (extensible via promotion)`,linkedScenarioId:"assassin-cimetiere",role:"Agent d’élimination & de renseignement permanent au cimetière (3 exemplaires au départ).",objective:"Éliminer des pions adverses clés pour connaître avec certitude les forces restantes de l’ennemi (ex. confirmer si sa Reine ou son Exécuteur est déjà tombé).",movements:"1 case dans les 8 directions (horizontale, verticale ou diagonale).",attacks:"Élimine toute pièce ennemie adjacente à 1 case (hors Colosse et Invincible).",restrictions:["Ne révèle rien passivement avant d’éliminer sa cible.","S’il meurt en même temps par Kamikaze lors de l’élimination, sa révélation permanente ne s’active pas."],specialAbilities:"Révélation définitive de la victime : l’identité exacte de toute pièce tuée par un Assassin vous est révélée de manière permanente (même sous Brouillard ou Contre-espionnage), visible directement dans le cimetière.",specialConditions:["Indispensable pour savoir si un ennemi éliminé était la Reine, le Colosse ou un simple Soldat (ce que les autres pions ne révèlent pas si l’ennemi était caché)."],concreteExamples:["Vous abattez un pion « ? » avec votre Assassin : le cimetière révèle aussitôt qu’il s’agissait de l’Exécuteur adverse !"],mistakesToAvoid:["Le confondre avec un Guetteur : placer un Assassin à côté d’un pion ennemi ne le révèle pas tant qu’il ne l’élimine pas."],demoSteps:[{id:"assassin-ste lement/Verticalement (H/V) et BOUGE en diagonale !"],demoSteps:[{id:"gh-step-1",stepTitle:"1. Déplacement diagonal + Détection H/V (1 case)",verdictBadge:"AUTORISÉ",explanation:"Cases vertes = déplacements/attaques en diagonale. Cases cyan = zone de reconnaissance passive H/V qui dévoile les ennemis.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_h",owner:"red"},{row:2,col:3,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:1,kind:"move"},{row:1,col:3,kind:"move"},{row:3,col:1,kind:"move"},{row:3,col:3,kind:"move"},{row:1,col:2,kind:"recon",tag:"Détecte"},{row:3,col:2,kind:"recon",tag:"Détecte"},{row:2,col:1,kind:"recon",tag:"Détecte"},{row:2,col:3,kind:"recon",tag:"Révélé !"}]}]},guetteur_d:{id:"guetteur_d",name:"Guetteur D",initialQuantity:fe.guetteur_d,maxBoardCapLabel:`${fe.guetteur_d} au départ (extensible via promotion)`,linkedScenarioId:"recon-guetteurs",role:"Éclaireur à détection diagonale (3 exemplaires au départ) — se déplace en H/V et observe les 4 coins diagonaux.",objective:"Compléter vos Guetteurs H en surveillant les diagonales d’approche autour des points stratégiques.",movements:"1 case uniquement horizontalement ou verticalement (les 4 axes orthogonaux).",attacks:"Élimine en horizontal ou vertical à 1 case (hors Colosse).",restrictions:["Ne se déplace jamais en diagonale.","Sa détection est neutralisée par Brouillard et Contre-espionnage."],specialAbilities:"Reconnaissance Diagonale : révèle passivement et temporairement toute pièce ennemie située à 1 case sur l’une des 4 diagonales.",specialConditions:["Combinez 1 Guetteur D + 1 Guetteur H pour verrouiller la quasi-totalité d’un carré contre les approches secrètes."],concreteExamples:["Posté en D5, votre Guetteur D révèle automatiquement un pion ennemi posé en E6 et C6 sans dépenser aucune carte."],mistakesToAvoid:["Croire que la lettre D veut dire « Déplacement Diagonal » : D signifie « Détection Diagonale » (déplacement orthogonal H/V) !"],demoSteps:[{id:"gd-step-1",stepTitle:"1. Déplacement orthogonal H/V + Détection Diagonale (1 case)",verdictBadge:"AUTORISÉ",explanation:"Cases vertes = déplacements/attaques H/V. Cases cyan = 4 coins diagonaux surveillés passivement.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_d",owner:"red"},{row:1,col:3,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:2,kind:"move"},{row:3,col:2,kind:"move"},{row:2,col:1,kind:"move"},{row:2,col:3,kind:"move"},{row:1,col:1,kind:"recon",tag:"Détecte"},{row:1,col:3,kind:"recon",tag:"Révélé !"},{row:3,col:1,kind:"recon",tag:"Détecte"},{row:3,col:3,kind:"recon",tag:"Détecte"}]}]},traqueur:{id:"traqueur",name:"Traqueur",initialQuantity:fe.traqueur,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",linkedScenarioId:"traqueur-marquage-poursuite",role:"Chasseur orthogonal à portée 2 (étendue jusqu’à 4 cases en Poursuite sur cible traquée).",objective:"Cibler gratuitement sur l’échiquier une cible ennemie révélée (1–4 cases H/V) pour débloquer une percée ou capture jusqu’à 4 cases vers elle.",movements:"1 à 2 cases horizontalement ou verticalement (ligne dégagée). Dès qu’une cible est traquée : jusqu’à 4 cases vers la cible marquée uniquement.",attacks:"Élimine jusqu’à 2 cases H/V (hors Colosse). À distance 3 ou 4 (Poursuite), ne peut capturer QUE la cible marquée.",restrictions:["Aucun déplacement en diagonale ni saut par-dessus une pièce.","Portée standard limitée à 2 cases (sans cible traquée, 3 ou 4 cases est impossible).","Impossible de marquer un ennemi encore inconnu (« ? ») ou derrière un obstacle.","Impossible d’abattre le Colosse (même avec Poursuite)."],specialAbilities:"Ciblage sur l’échiquier (0 action) & Poursuite (jusqu’à 4 cases) : sélectionnez le Traqueur → cliquez « Cibler » (coûte 0 action) puis cliquez directement sur une cible DÉJÀ révélée alignée à 1–4 cases H/V sur l’échiquier → votre portée s’étend immédiatement jusqu’à 4 cases H/V dans la direction de rapprochement.",special ,executeur:{id:"executeur",name:"Exécuteur",initialQuantity:fe.executeur,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",linkedScenarioId:"executeur-frappe-traversante",role:"Percuteur de ligne anti-Colosse (1 exemplaire unique). Punition redoutable contre les formations alignées.",objective:"Punir tout alignement de 2 pièces adverses devant lui en abattant directement la 2e pièce derrière la 1re — même s’il s’agit du Colosse.",movements:"1 ou 2 cases horizontalement ou verticalement (ligne dégagée, sans diagonale).",attacks:"Attaque normale à 1–2 cases (hors Colosse) OU Frappe traversante à exactement 2 cases derrière 1 seule pièce ennemie intermédiaire non-Colosse.",restrictions:["Aucun déplacement diagonal ni changement de direction.","Impossible de frapper à travers une pièce alliée, à travers 2 pièces ou à travers un Colosse.","Ne tue pas un Colosse en attaque frontale directe : uniquement s’il est Ennemi 2 lors d’une Frappe traversante !"],specialAbilities:"Frappe traversante : avec l’alignement H/V [Exécuteur → Ennemi 1 (≠ Colosse) → Ennemi 2], l’Exécuteur reste sur sa case et élimine Ennemi 2 sans toucher Ennemi 1. Il traverse et abat le Colosse en cible arrière !",specialConditions:["Si vous préférez capturer Ennemi 1 (à 1 case), cliquez sur Ennemi 1 ; si vous visez Ennemi 2 (à 2 cases), cliquez sur Ennemi 2 pour exécuter la Frappe traversante sans bouger.","Kamikaze sur Ennemi 2 s’applique aussi contre l’Exécuteur (sauf s’il porte Protection)."],concreteExamples:["Alignement en colonne : votre Exécuteur en D3, un Soldat noir en D4, le Colosse noir (ou le Roi !) en D5 → cliquez D5 : le Colosse/Roi en D5 explose tandis que votre Exécuteur reste en D3 et que le Soldat D4 reste en vie."],mistakesToAvoid:["Tenter d’attaquer directement un Colosse collé à 1 case sans pièce écran devant lui.","Oublier qu’une pièce alliée en position intermédiaire bloque la Frappe traversante."],demoSteps:[{id:"executeur-step-1",stepTitle:"1. Frappe traversante : [Exécuteur] → [Ennemi 1 intact] → [Ennemi 2 éliminé]",verdictBadge:"CAPACITÉ",explanation:"En cliquant sur le Colosse (Ennemi 2 à 2 cases derrière le Soldat noir), l’Exécuteur reste sur place et l’abat sans déplacer le Soldat intermédiaire.",rows:5,cols:5,pieces:[{row:3,col:2,kind:"executeur",owner:"red"},{row:2,col:2,kind:"soldat",owner:"black"},{row:1,col:2,kind:"colosse",owner:"black"}],highlights:[{row:3,col:2,kind:"selected",tag:"Reste sur place"},{row:2,col:2,kind:"move",tag:"Épargné"},{row:1,col:2,kind:"attack",tag:"Frappe KO !"}],arrows:[{from:{row:3,col:2},to:{row:1,col:2},kind:"pierce"}]},{id:"executeur-step-2",stepTitle:"2. Interdit à travers un allié ou un Colosse devant",verdictBadge:"INTERDIT",explanation:"Un allié ou un Colosse placé en case intermédiaire bloque toute Frappe traversante derrière lui.",rows:5,cols:5,pieces:[{row:3,col:2,kind:"executeur",owner:"red"},{row:2,col:2,kind:"soldat",owner:"red"},{row:1,col:2,kind:"roi",owner:"black"}],highlights:[{row:3,col:2,kind:"selected"},{row:2,col:2,kind:"forbidden",tag:"Allié bloque"},{row:1,col:2,kind:"forbidden",tag:"Inaccessible"}],arrows:[{from:{row:3,col:2},to:{row:1,col:2},kind:"forbidden"}]}]},arbaletrier:{id:"arbaletrier",name:"Arbalétrier",initialQuantity:fe.arbaletrier,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",linkedScenarioId:"arbaletrier-tir-cadence",role:"Tireur d’élite à distance (1 exemplaire unique) avec recharge stricte par tours personnels.",objective:"Éliminer à distance des unités clés (jusqu’au Roi !) à 1–3 cases sur les 8 directions sans exposer votre position, tout en gérant la cadence de 1 tir tous les 3 tours.",movements:"Déplacement normal d’1 case uniquement horizontalement ou verticalement (jamais en diagonale ; autorisé pendant la recharge).",attacks:"Tir à distance de 1 à 3 cases dans les 8 directions en ligne dégagée, sans déplacer l’Arbalétrier (ou capture au corps à corps à 1 case H/V).",restrictions:["Ne se déplace jamais en diagonale (seul le tir vise en diagonale).","Ne peut tirer à travers aucune pièce.","Impossible de tuer le Colosse (même avec Double Action). Un tir bloqué sur une pièce cachée ne révèle JAMAIS son identité.","Cadence stricte : 1 tir tous les 3 tours personnels."],specialAbilities:"Cadence 1 tir / 3 tours personnels : vous tirez au Tour 1 → recharge obligatoire au Tour 2 (2T restants) et au Tour 3 (1T restant) → prêt à tirer au Tour 4. Les tours adverses ne décomptent pas cette recharge.",specialConditions:["Double Action ne permet jamais de tirer deux fois ; Téléportation ne réinitialise jamais le délai.","Si un ennemi est collé à 1 case H/V et que le tir est prêt, vous choisissez librement Tir sur place OU Capture en avançant."],concreteExamples:["Tour 1 : votre Arbalétrier tire à 3 cases en diagonale et abat un ennemi sans bouger. Tour 2 et Tour 3 : il se repositionne d’1 case H/V pendant la recharge. Tour 4 : le tir redevient prêt !"],mistakesToAvoid:["Croire que les tours de l’adversaire comptent dans les 3 tours de recharge.","Tirer sur un pion sans Guetteur en espérant apprendre s’il est Colosse s’il survit : un tir bloqué garde son secret complet !"],demoSteps:[{id:"arbaletrier-step-1",stepTitle:"1. Tir dans les 8 directions (1–3 cases dégagées, reste sur place)",verdictBadge:"AUTORISÉ",explanation:"Tant que le tir est prêt et la ligne dégagée, vous frappez jusqu’à 3 cases (y compris en diagonale !) sans quitter votre case.",rows:5,cols:5,pieces:[{row:3,col:1,kind:"arbaletrier",owner:"red"},{row:0,col:4,kind:"secret",owner:"black"},{row:2,col:1,kind:"soldat",owner:"red"}],highlights:[{row:3,col:1,kind:"selected",tag:"Tir PRÊT"},{row:3,col:0,kind:"move"},{row:3,col:2,kind:"move"},{row:4,col:1,kind:"move"},{row:0,col:4,kind:"attack",tag:"Tir 3 cases"},{row:1,col:1,kind:"forbidden",tag:"Bloqué"}],arrows:[{from:{row:3,col:1},to:{row:0,col:4},kind:"shoot"}]},{id:"arbaletrier-step-2",stepTitle:"2. Cycle exact : Tour 1 Tir → Tour 2 (2T) → Tour 3 (1T) → Tour 4 Prêt",verdictBadge:"CAPACITÉ",explanation:"Pendant les 2 tours de recharge personnels, seul le déplacement normal d’1 case H/V reste utilisable.",rows:5,cols:5,pieces:[{row:3,col:1,kind:"arbaletrier",owner:"red"},{row:1,col:3,kind:"secret",owner:"black"}],highlights:[{row:3,col:1,kind:"mark",tag:"Recharge 2T"},{row:2,col:1,kind:"move"},{row:3,col:2,kind:"move"},{row:1,col:3,kind:"forbidden",tag:"Tir verrouillé"}]}]},soldat:{id:"soldat",name:"Soldat",initialQuantity:fe.soldat,maxBoardCapLabel:`${fe.soldat} au départ (recrutable)`,linkedScenarioId:"pions-et-promotion",role:"Infanterie de base (9 exemplaires) destinée à ouvrir le terrain, protéger vos cadres et obtenir une Promotion majeure.",objective:"Percer en diagonale, déclencher les pièges ou effets adverses et atteindre la rangée finale adverse pour se transformer en pièce d’élite.",movements:"Avance d’1 case vers le camp opposé : tout droit (case libre uniquement) ou en diagonale avant gauche/droite.",attacks:"Élimine uniquement en diagonale avant (1 case) — jamais tout droit !",restrictions:["Ne peut jamais reculer (sauf carte Retreat).","Ne capture jamais tout droit devant lui.","Ne peut jamais être promu en Roi."],specialAbilities:"Promotion : en atteignant la dernière rangée adverse, choisissez sa nouvelle identité parmi Guetteur H/D, Assassin, Cavalier, Berserker — et même Reine, Colosse, Traqueur, Exécuteur ou Arbalétrier si votre unique exemplaire a été éliminé ! De plus, seul le Soldat peut être ciblé par Sacrifice ou Recrutement.",specialConditions:["Les pièces à plafond strict de 1 (Reine, Colosse, Traqueur, Exécuteur, Arbalétrier) n’apparaissent dans vos choix de promotion que lorsqu’elles sont à 0 exemplaire vivant sur le plateau."],concreteExamples:["Un pion ennemi bloque votre avancée tout droit devant votre Soldat : votre Soldat ne peut pas le prendre tout droit, mais un Soldat voisin en diagonale peut le capturer."],mistakesToAvoid:["Aligner un Soldat droit devant un ennemi en croyant le bloquer ou le manger en avant : seules ses diagonales avant attaquent."],demoSteps:[{id:"soldat-step-1",stepTitle:"1. Avance tout droit sans capture / Attaque en diagonale avant",verdictBadge:"AUTORISÉ",explanation:"Un Soldat ne capture jamais tout droit devant lui : seules les deux diagonales avant permettent d’éliminer un ennemi.",rows:5,cols:5,pieces:[{row:3,col:2,kind:"soldat",owner:"red"},{row:2,col:2,kind:"secret",owner:"black"},{row:2,col:3,kind:"secret",owner:"black"}],highlights:[{row:3,col:2,kind:"selected"},{row:2,col:1,kind:"move"},{row:2,col:3,kind:"attack",tag:"Capture diag"},{row:2,col:2,kind:"forbidden",tag:"Tout droit interdit"}],arrows:[{from:{row:3,col:2},to:{row:2,col:3},kind:"attack"}]},{id:"soldat-step-2",stepTitle:"2. Promotion en atteignant la dernière rangée adverse",verdictBadge:"CAPACITÉ",explanation:"Arrivé tout au bout, le Soldat devient au choix une pièce d’élite disponible.",rows:5,cols:5,pieces:[{row:1,col:2,kind:"soldat",owner:"red"}],highlights:[{row:1,col:2,kind:"selected"},{row:0,col:2,kind:"mark",tag:"PROMOTION !"}],arrows:[{from:{row:1,col:2},to:{row:0,col:2},kind:"move"}]}]}},yv=[{id:"regles_generales",label:"Règles générales",icon:"📜",summary:"Plateau 9×9, placement secret initial des 27 pièces, objectif Roi et pendule."},{id:"presentation_pieces",label:"Présentation des pièces",icon:"♟️",summary:"Fiches détaillées et interactives pour chacune des 12 unités de BlindWar."},{id:"deplacements",label:"Déplacements",icon:"🧭",summary:"Règles exactes de trajectoires, sauts du Cavalier, restrictions et obstacles."},{id:"attaques_captures",label:"Attaques et captures",icon:"⚔️",summary:"Corps à corps, diagonale du Soldat, Tir d’arbalète, Frappe traversante et Armure."},{id:"regles_speciales",label:"Règles spéciales",icon:"✨",summary:"Identités cachées, Guetteurs, Marquage Traqueur, Colosse, Promotions et 16 Cartes."},{id:"situations_particulieres",label:"Situations particulières",icon:"⚖️",summary:"Tour Bonus 2+ éliminations, Kamikaze 2/2, Invincibilité/Protection, Répétition x5 et Pat."},{id:"strategies_conseils",label:"Stratégies et conseils",icon:"🧠",summary:"Couverture de reconnaissance, gestion du Brouillard, leurres du Roi et tempo."},{id:"exemples_parties",label:"Exemples de parties",icon:"🎓",summary:"Scénarios jouables guidés pour pratiquer chaque mécanique sur le véritable plateau."}],tl=[{id:"rule-visibility-hierarchy",category:"regles_speciales",badge:"👁️",title:"Hiérarchie des Révélations (Guetteurs, Assassin, Brouillard & Espionnage)",summary:"Toutes les sources de révélation et de camouflage suivent un ordre de priorité strict côté serveur.",relatedCharacterIds:["guetteur_h","guetteur_d","assassin"],relatedCards:["revelation_temporaire","revelation_permanente","espionnage","contre_espionnage","brouillard"],linkedScenarioId:"recon-guetteurs",howItWorksSteps:["1. Proximité (Guetteur H en H/V, Guetteur D en diagonale à 1 case) : révélation temporaire tant que le Guetteur reste vivant adjacent.","2. Révélation temporaire (carte 👁️ ou attaque ratée sur Colosse) : dure 1 tour complet.","3. Contre-espionnage (🕶️ sur 1 pièce, 3 tours) : bloque Guetteurs et Révélation temporaire.","4. Espionnage (📡 jusqu’à 2 ennemis, 3 tours) : PERCE le Contre-espionnage.","5. Brouillard (🌫️ toute votre armée, 3 tours) : bloque Guetteurs, Révélation temporaire ET Espionnage.","6. Révélation définitive (Assassin tuant sa victime ou carte 🔍) : JAMAIS annulée, ni par Brouillard ni par Contre-espionnage."],whenToUse:"Activez Brouillard pour casser un Marquage du Traqueur adverse ou masquer un siège devant vos lignes.",conditions:["Chaque niveau supérieur neutralise ou contourne exactement les niveaux inférieurs selon l’ordre officiel."],limits:["Un Guetteur H ne révèle que H/V (1 case) ; il ne traverse ni les cases vides au-delà de 1 case ni Brouillard."],examples:["L’ennemi lance Contre-espionnage sur sa Reine puis croit être intouchable : votre carte Espionnage passe à travers et la révèle aussitôt pour votre Traqueur."],consequences:["Dès qu’une cible redevient masquée (expiration ou Brouillard), tout marquage actif du Traqueur sur elle disparaît immédiatement."],demoSteps:[{id:"vis-demo-1",stepTitle:"1. Guetteur H + Guetteur D dévoilent en croix et en diagonale",verdictBadge:"CAPACITÉ",explanation:"Un pion ennemi entrant dans le rayon orthogonal du Guetteur H ou diagonal du Guetteur D est immédiatement identifié.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_h",owner:"red"},{row:1,col:2,kind:"reine",owner:"black"},{row:2,col:3,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:2,kind:"recon",tag:"Reine vue!"},{row:2,col:3,kind:"recon",tag:"Identifié"},{row:3,col:2,kind:"recon"},{row:2,col:1,kind:"recon"}]},{id:"vis-demo-2",stepTitle:"2. Brouillard / Contre-espionnage recouvre la pièce temporairement",verdictBadge:"INTERDIT",explanation:"Sous Brouillard ou Contre-espionnage, l’ennemi redevient « ? » face aux Guetteurs et le Traqueur perd sa marque.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_h",owner:"red"},{row:1,col:2,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:2,kind:"forbidden",tag:"Brouillard"}]}]},{id:"rule-colosse-kamikaze",category:"regles_speciales",badge:"💥",title:`Colosse : Armure, Bascule d’extrémité & Règle des ${dt} Kamikazes`,summary:`Le Colosse résiste aux attaques normales et à l’Arbalétrier, mais tombe après ${dt} déclenchements de Kamikaze qu’il provoque lui-même.`,relatedCharacterIds:["colosse"],relatedCards:["kamikaze","protection","invincibilite"],linkedScenarioId:"kamikaze-colosse-v2",howItWorksSteps:["1. Progression : 5 directions vers l’avant/côtés ; arrivé tout au bout du plateau, il inverse son sens et reste révélé 1 tour complet.","2. Seuls Roi, Reine, autre Colosse et la Frappe traversante de l’Exécuteur (en cible arrière) le tuent directement.",`3. Au 1er ennemi sous Kamikaze abattu par ce Colosse : le Kamikaze explose, le Colosse SURVIT à 1/${dt}.`,`4. Au ${dt}e ennemi sous Kamikaze abattu par ce même Colosse : le Colosse est ÉLIMINÉ (${dt}/${dt}).`],whenToUse:"Placez deux cartes Kamikaze sur les pions situés sur le chemin d’un Colosse adverse hors de portée de votre Reine.",conditions:["Le compteur n’augmente QUE pour les explosions Kamikaze déclenchées par le Colosse en attaquant lui-même."],limits:["Un Kamikaze déclenché contre une autre pièce que le Colosse n’avance JAMAIS le compteur du Colosse.","Le Colosse ne peut jamais recevoir Kamikaze, Protection, Invincibilité ni Résurrection."],examples:["Votre Colosse mange un Soldat Kamikaze (compteur 1/2, survit), puis deux tours plus tard capture un Guetteur Kamikaze (compteur 2/2, éliminé)."],consequences:["Le compteur (0/2, 1/2) est persisté côté serveur et affiché dans le panneau gauche du propriétaire."],demoSteps:[{id:"col-kam-1",stepTitle:"Étape 1 : 1er Kamikaze provoqué par le Colosse → Survie (1/2)",verdictBadge:"CAPACITÉ",explanation:"L’ennemi Kamikaze explose mais le Colosse encaisse le choc et passe son compteur à 1/2.",rows:5,cols:5,pieces:[{row:3,col:2,kind:"colosse",owner:"red"},{row:2,col:2,kind:"soldat",owner:"black"}],highlights:[{row:3,col:2,kind:"selected",tag:"0/2 → 1/2"},{row:2,col:2,kind:"attack",tag:"Kamikaze 1"}],arrows:[{from:{row:3,col:2},to:{row:2,col:2},kind:"attack"}]},{id:"col-kam-2",stepTitle:"Étape 2 : 2e Kamikaze provoqué par le Colosse → Élimination (2/2)",verdictBadge:"EXEMPLE",explanation:"Déjà entamé à 1/2, le Colosse ne survit pas à une seconde explosion Kamikaze et disparaît du plateau.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"colosse",owner:"red"},{row:1,col:2,kind:"berserker",owner:"black"}],highlights:[{row:2,col:2,kind:"selected",tag:"1/2 → 2/2 KO"},{row:1,col:2,kind:"attack",tag:"Kamikaze 2"}],arrows:[{from:{row:2,col:2},to:{row:1,col:2},kind:"attack"}]}]},{id:"rule-traqueur-marquage",category:"regles_speciales",badge:"🎯",title:"Ciblage sur l’échiquier (0 action) & Poursuite à 4 cases (Traqueur)",summary:"Portée de base de 2 cases H/V ; cibler gratuitement sur l’échiquier un ennemi déjà identifié étend la Poursuite jusqu’à 4 cases.",relatedCharacterIds:["traqueur"],linkedScenarioId:"traqueur-marquage-poursuite",howItWorksSteps:["1. Portée de base : le Traqueur se déplace et capture à 1 ou 2 cases orthogonalement sans obstacle.","2. Vérifiez qu’un ennemi est DÉJÀ révélé et aligné H/V à 1–4 cases de votre Traqueur sans obstacle.","3. Sélectionnez votre Traqueur → cliquez sur « Cibler (0 PA) » → cliquez directement sur l’ennemi révélé sur l’échiquier : la marque est posée gratuitement, vous gardez toute votre action du tour.","4. Dès que la cible est traquée, la portée vers la direction qui rapproche de la cible augmente jusqu’à 4 cases H/V."],whenToUse:"Dès qu’un Guetteur ou Espionnage dévoile une pièce majeure ennemie alignée jusqu’à 4 cases de votre Traqueur.",conditions:["Cible strictement déjà révélée (jamais « ? »), alignée orthogonalement (1–4 cases) et sans obstacle."],limits:["Sans cible traquée, la portée reste strictement bloquée à 2 cases H/V.","À distance 3 ou 4, impossible d’éliminer une autre pièce que la cible marquée (et jamais un Colosse).","Si la cible redevient masquée ou meurt, le marquage disparaît instantanément."],examples:["Vous ciblez une Reine ennemie révélée à 4 cases sur l’échiquier (0 PA) — votre Traqueur fond immédiatement sur 4 cases et l’abat."],consequences:["Le déplacement à distance 3 ou 4 consomme le marquage ; un trajet de 1–2 cases ou une Téléportation le conserve actif."],demoSteps:Wn.traqueur.demoSteps},{id:"rule-executeur-piercing",category:"attaques_captures",badge:"🪓",title:"Frappe traversante de l’Exécuteur",summary:"Frappe à exactement 2 cases derrière une pièce ennemie écran sans toucher la première pièce — perce même le Colosse.",relatedCharacterIds:["executeur"],linkedScenarioId:"executeur-frappe-traversante",howItWorksSteps:["1. Alignement orthogonal exact requis : [Exécuteur] → [Ennemi 1 (≠ Colosse)] → [Ennemi 2].","2. Cliquez sur la case d’Ennemi 2 : choisissez « Frappe traversante » si un choix s’affiche.","3. L’Exécuteur reste sur sa case de départ ; Ennemi 1 reste intact sur sa case ; Ennemi 2 est éliminé !"],whenToUse:"Quand l’adversaire protège son Colosse ou son Roi derrière un simple Soldat aligné devant votre Exécuteur.",conditions:["Exactement 1 pièce ennemie non-Colosse entre l’Exécuteur et la cible arrière sur la même ligne/colonne."],limits:["Impossible à travers une pièce alliée, à travers 2 pièces ou si l’écran est un Colosse (un Colosse écran cache/bloque la frappe et est révélé 1 tour)."],examples:["Exécuteur en D3, Soldat ennemi en D4, Roi (ou Colosse) ennemi en D5 : cliquez D5 pour gagner ou abattre le Colosse sans déplacer D3 !"],consequences:["Si Ennemi 2 porte Kamikaze, son explosion atteint l’Exécuteur (sauf Protection) ; si Ennemi 2 porte Protection, sa Protection se brise."],demoSteps:Wn.executeur.demoSteps},{id:"rule-arbaletrier-cadence",category:"attaques_captures",badge:"🏹",title:"Tir à distance & Cadence (1 tir / 3 tours personnels)",summary:"Tir sur 1–3 cases dans les 8 directions suivi de 2 tours personnels d’attente obligatoire.",relatedCharacterIds:["arbaletrier"],linkedScenarioId:"arbaletrier-tir-cadence",howItWorksSteps:["1. Tour 1 (Prêt) : visez une cible ennemie en ligne dégagée à 1, 2 ou 3 cases (8 directions) ; l’Arbalétrier ne se déplace pas.","2. Tour 2 personnel : Tir indisponible (2 tours d’attente restants) — seul le pas d’1 case H/V est autorisé.","3. Tour 3 personnel : Tir indisponible (1 tour d’attente restant).","4. Tour 4 personnel : Le tir redevient disponible automatiquement !"],whenToUse:"Pour éliminer à distance sans subir de Piège sur la case ciblée ni bouger votre ligne de défense.",conditions:["Ligne de visée totalement dégagée entre l’Arbalétrier et la cible."],limits:["Les tours de l’adversaire ne font jamais avancer la recharge.","Double Action ne permet jamais de tirer 2 fois ; Téléportation ne réinitialise jamais le compteur.","Ne tue jamais le Colosse et ne révèle pas un Colosse inconnu s’il bloque le tir."],examples:["Après un tir bloqué par Protection au Tour 1, la recharge démarre tout de même (2 tours d’attente)."],consequences:["Si la cible abattue à distance porte Kamikaze, l’explosion emporte aussi l’Arbalétrier (sauf Protection)."],demoSteps:Wn.arbaletrier.demoSteps},{id:"rule-cavalier-mobility",category:"deplacements",badge:"🐴",title:"Cavalier : Bond en « L » & Saut Percée sans pénalité",summary:"Triple mobilité orthogonale/équestre permettant de sauter les obstacles et de déclencher un Tour Bonus à 2+ éliminations.",relatedCharacterIds:["cavalier"],linkedScenarioId:"cavalier-bond-et-percee",howItWorksSteps:["1. Choisissez soit un pas simple de 1 case H/V, soit un Bond en « L » (2×1), soit un Saut Percée style dames au-dessus d’un ennemi adjacent vers la case vide derrière.","2. Pendant un Bond en « L », vous survolez toutes les pièces (même le Colosse) et tous les pièges intermédiaires sans les déclencher.","3. Pendant un Saut Percée, chaque ennemi sauté est éliminé et vous pouvez enchaîner ou cliquer « Terminer les sauts »."],whenToUse:"Pour briser une défense verrouillée en début de partie sans aucun risque de pénalité en cas de coup pacifique.",conditions:["Pour le Saut Percée, la case de réception immédiatement derrière l’ennemi doit être libre et l’ennemi sauté ne doit pas être un Colosse."],limits:["Plus de déplacement d’1 case en diagonale.","Ne peut tuer aucun Colosse directement."],examples:["Double Saut Percée dans un même tour : 2 ennemis éliminés → Tour Bonus immédiat de 1 mouvement supplémentaire !"],consequences:["Seule la case d’arrivée d’un Bond en « L » peut déclencher un Piège."],demoSteps:Wn.cavalier.demoSteps},{id:"rule-promotion-cap",category:"regles_speciales",badge:"👑",title:"Promotion du Soldat & Plafond strict de 1 exemplaire",summary:"Tout Soldat parvenu sur la dernière rangée ennemie se transforme selon les plafonds actifs de votre armée.",relatedCharacterIds:["soldat"],linkedScenarioI
