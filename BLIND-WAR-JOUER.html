,"Ne possède aucune capacité de reconnaissance.","Son déplacement de Rage ne permet pas de capturer une seconde pièce."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:-2,dCol:0,kind:"move_and_attack"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:2,dCol:0,kind:"move_and_attack"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:-2,kind:"move_and_attack"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:0,dCol:2,kind:"move_and_attack"}]},assassin:{id:"assassin",name:tt.assassin.name,symbol:"AS",roleSummary:tt.assassin.roleSummary,initialQuantity:be.assassin,maxBoardCapLabel:`Peut dépasser ${be.assassin} via promotion`,movementSummary:"1 case dans les 8 directions.",attackSummary:"Élimine toute pièce ennemie adjacente (hors Colosse et Invincible).",specialAbility:"Révèle définitivement l’identité de chaque pièce ennemie qu’il élimine (visible aussi dans le cimetière).",interactionsSummary:["Traverse Contre-espionnage et Brouillard au moment de l’élimination (sauf décès simultané par Kamikaze)."],restrictions:["Ne révèle pas les pièces autour de lui sans les éliminer.","Si l’Assassin est tué par un effet Kamikaze lors de son attaque, sa capacité de révélation permanente ne se déclenche pas."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:-1,dCol:-1,kind:"move_and_attack"},{dRow:-1,dCol:1,kind:"move_and_attack"},{dRow:1,dCol:-1,kind:"move_and_attack"},{dRow:1,dCol:1,kind:"move_and_attack"}]},guetteur_h:{id:"guetteur_h",name:tt.guetteur_h.name,symbol:"GH",roleSummary:tt.guetteur_h.roleSummary,initialQuantity:be.guetteur_h,maxBoardCapLabel:`${be.guetteur_h} au départ (peut dépasser ${be.guetteur_h} via promotion)`,movementSummary:"1 case en diagonale (dans les 4 directions diagonales).",attackSummary:"Élimine à 1 case en diagonale.",specialAbility:"Reconnaissance H/V : révèle temporairement l’identité des pièces ennemies situées à 1 case horizontalement ou verticalement tant qu’elles restent dans sa zone et qu’il est en vie.",interactionsSummary:["Traqueur : les cibles détectées par ce Guetteur peuvent être marquées si le Traqueur est aligné.","Arbalétrier : révèle la cible sur sa ligne de tir sans modifier la portée ni la récupération."],restrictions:["Sa reconnaissance s’arrête si la pièce quitte la zone, si le Guetteur est éliminé, ou si Brouillard / Contre-espionnage est actif.","Ne transforme jamais une révélation de proximité en révélation permanente."],diagramMoves:[{dRow:-1,dCol:-1,kind:"move_and_attack"},{dRow:-1,dCol:1,kind:"move_and_attack"},{dRow:1,dCol:-1,kind:"move_and_attack"},{dRow:1,dCol:1,kind:"move_and_attack"},{dRow:-1,dCol:0,kind:"recon"},{dRow:1,dCol:0,kind:"recon"},{dRow:0,dCol:-1,kind:"recon"},{dRow:0,dCol:1,kind:"recon"}]},guetteur_d:{id:"guetteur_d",name:tt.guetteur_d.name,symbol:"GD",roleSummary:tt.guetteur_d.roleSummary,initialQuantity:be.guetteur_d,maxBoardCapLabel:`${be.guetteur_d} au départ (peut dépasser ${be.guetteur_d} via promotion)`,movementSummary:"1 case horizontalement ou verticalement (dans les 4 directions orthogonales : avant, arrière, gauche, droite).",attackSummary:"Élimine à 1 case horizontalement ou verticalement.",specialAbility:"Reconnaissance Diagonale : révèle temporairement l’identité des pièces ennemies situées à 1 case en diagonale tant qu’elles restent dans sa zone et qu’il est en vie.",interactionsSummary:["Traqueur & Arbalétrier : facilite la détection des pièces cachées sur les colonnes et diagonales."],restrictions:["Ne se déplace jamais en diagonale.","Sa reconnaissance est bloquée par Brouillard et Contre-espionnage."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:-1,dCol:-1,kind:"recon"},{dRow:-1,dCol:1,kind:"recon"},{dRow:1,dCol:-1,kind:"recon"},{dRow:1,dCol:1,kind:"recon"}]},traqueur:{id:"traqueur",name:tt.traqueur.name,symbol:"TQ",roleSummary:tt.traqueur.roleSummary,initialQuantity:be.traqueur,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",movementSummary:"Déplacement standard de 1 à 2 cases horizontalement ou verticalement (ligne dégagée, sans diagonale ni saut). Dès qu’un ennemi révélé est ciblé (Marquage 0 PA), sa portée de Poursuite s’étend jusqu’à 4 cases H/V uniquement dans la direction qui s’en rapproche.",attackSummary:"Élimine jusqu’à 1 ennemi à portée sur sa case d’arrivée (hors Colosse). À distance 3 ou 4 (Poursuite), ne peut capturer QUE la cible marquée (impossible d’éliminer un pion caché ou une autre cible à 3–4 cases).",specialAbility:"Marquage / Ciblage sur l’échiquier (0 action) & Poursuite (jusqu’à 4 cases) : 1) Objectif : récompenser la détection d’une cible en étendant la portée de 2 à 4 cases. 2) Condition : ennemi DÉJÀ révélé (Guetteur, carte, Colosse révélé), aligné H/V à 1–4 cases sans obstacle. 3) Activation gratuite (0 action) en cliquant « Cibler » puis en cliquant directement sur le pion ennemi sur l’échiquier. 4) Durée : tant que la cible reste en vie et identifiable. 5) Effet : dès que la cible est traquée, un trajet orthogonal vers elle monte jusqu’à 4 cases ; un trajet de 3 ou 4 cases consomme le marquage (un trajet de 1–2 cases le conserve).",interactionsSummary:["Visibilité & Fin d’effet : personne ne peut marquer une pièce inconnue (« ? ») ; le marquage est secret pour l’adversaire et disparaît aussitôt si la cible meurt ou redevient cachée (Brouillard, Contre-espionnage, sortie de zone d’un Guetteur ou expiration de Révélation temporaire).","Autres pions : peut marquer un Colosse révélé pour approcher plus vite jusqu’à 4 cases, mais ne peut JAMAIS l’éliminer directement ; respecte Protection, Invincibilité et Kamikaze ; un seul Traqueur par camp.","Cartes : fonctionne avec Révélation temporaire/permanente et Espionnage pour marquer ; Téléportation ne consomme pas la Poursuite ; une seule cible marquée active à la fois."],restrictions:["Portée standard strictement limitée à 1–2 cases H/V tant qu’aucune cible n’est traquée ; impossible de marquer une pièce ennemie cachée (« ? ») ni à travers une autre pièce.","La Poursuite jusqu’à 4 cases ne se déclenche que pour un trajet qui réduit la distance avec la cible marquée.","À distance 3 ou 4, impossible d’éliminer une autre pièce que la cible marquée."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:-2,dCol:0,kind:"move_and_attack"},{dRow:-3,dCol:0,kind:"pursuit"},{dRow:-4,dCol:0,kind:"pursuit"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:2,dCol:0,kind:"move_and_attack"},{dRow:3,dCol:0,kind:"pursuit"},{dRow:4,dCol:0,kind:"pursuit"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:-2,kind:"move_and_attack"},{dRow:0,dCol:-3,kind:"pursuit"},{dRow:0,dCol:-4,kind:"pursuit"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:0,dCol:2,kind:"move_and_attack"},{dRow:0,dCol:3,kind:"pursuit"},{dRow:0,dCol:4,kind:"pursuit"}]},executeur:{id:"executeur",name:tt.executeur.name,symbol:"EX",roleSummary:tt.executeur.roleSummary,initialQuantity:be.executeur,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",movementSummary:"1 ou 2 cases horizontalement ou verticalement, sans diagonale ni changement de direction ni traversée de pièce alliée.",attackSummary:"Attaque directe à 1–2 cases (ligne dégagée) OU Frappe traversante à 2 cases derrière exactement 1 pièce ennemie non-Colosse.",specialAbility:"Frappe traversante : si [Exécuteur, Ennemi 1, Ennemi 2] sont alignés orthogonalement et qu’Ennemi 1 n’est pas un Colosse, l’Exécuteur peut rester sur sa case pour éliminer Ennemi 2 en laissant Ennemi 1 intact. Seule capacité (hors Roi/Reine/Colosse/Kamikaze) capable d’éliminer un Colosse !",interactionsSummary:["Colosse : immunisé aux attaques normales de l’Exécuteur (1–2 cases directes), mais ÉLIMINABLE s’il est pris comme cible arrière de la Frappe traversante. Un Colosse intermédiaire bloque et interrompt la frappe (et est révélé temporairement s’il était caché).","Roi : peut être la pièce intermédiaire (intacte si vous frappez derrière) ou la cible arrière (victoire immédiate).","Protection / Invincibilité / Kamikaze : bloquent normalement la Frappe traversante ; Kamikaze sur la cible élimine aussi l’Exécuteur (sauf Protection).","Double Action / Téléportation : ne déclenchent aucune frappe automatique."],restrictions:["Aucun déplacement diagonal ; une seule pièce éliminée maximum.","Impossible de frapper à travers une pièce alliée, à travers 2 pièces ou à travers un Colosse.","Ne peut jamais avoir 2 Exécuteurs simultanément en jeu."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:-2,dCol:0,kind:"pierce"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:2,dCol:0,kind:"pierce"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:-2,kind:"pierce"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:0,dCol:2,kind:"pierce"}]},arbaletrier:{id:"arbaletrier",name:tt.arbaletrier.name,symbol:"AR",roleSummary:tt.arbaletrier.roleSummary,initialQuantity:be.arbaletrier,maxBoardCapLabel:"1 maximum absolu (même via promotion/résurrection)",movementSummary:"Déplacement normal uniquement d’1 case horizontalement ou verticalement (jamais en diagonale ; ne tire pas dans la même action ; autorisé pendant la recharge).",attackSummary:"Tir d’arbalète à distance de 1 à 3 cases dans les 8 directions, en ligne dégagée, sans déplacer l’Arbalétrier.",specialAbility:"Tir à distance & Cadence stricte (1 tir / 3 tours personnels) : après un tir (Tour 1), l’Arbalétrier est indisponible au Tour 2 et au Tour 3 de son propriétaire, puis redevient disponible au Tour 4. Les tours adverses ne font jamais avancer cette recharge. Peut viser une pièce inconnue sans la révéler si le tir est bloqué !",interactionsSummary:["Colosse : le Tir d’arbalète ne peut JAMAIS éliminer le Colosse (même sous Double Action) ; si le Colosse était caché, son identité reste secrète après un tir bloqué.","Protection / Invincibilité : la Protection absorbe le tir et se brise ; l’Invincibilité bloque le tir ; tout tir effectué déclenche le délai de recharge de 3 tours personnels.","Kamikaze : si une cible possédant Kamikaze est éliminée par un tir, l’explosion emporte l’Arbalétrier à distance (sauf s’il porte Protection).","Guetteurs : peuvent révéler la cible sur la ligne de tir sans modifier ni la portée (3 cases) ni la cadence de 3 tours.","Téléportation / Double Action / Block : Téléportation ne réinitialise jamais le temps de recharge, Double Action n’autorise jamais 2 tirs dans le même tour, et les tours adverses ne réduisent pas la recharge."],restrictions:["Ne se déplace jamais en diagonale (seul le tir vise en diagonale).","Ne peut pas tirer à travers une pièce alliée ou ennemie.","Impossible de tirer et de bouger dans la même action ; se déplacer reste possible pendant la récupération.","Ne peut jamais avoir 2 Arbalétriers simultanément en jeu."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_and_attack"},{dRow:1,dCol:0,kind:"move_and_attack"},{dRow:0,dCol:-1,kind:"move_and_attack"},{dRow:0,dCol:1,kind:"move_and_attack"},{dRow:-2,dCol:0,kind:"shoot"},{dRow:-3,dCol:0,kind:"shoot"},{dRow:2,dCol:0,kind:"shoot"},{dRow:3,dCol:0,kind:"shoot"},{dRow:0,dCol:-2,kind:"shoot"},{dRow:0,dCol:-3,kind:"shoot"},{dRow:0,dCol:2,kind:"shoot"},{dRow:0,dCol:3,kind:"shoot"},{dRow:-1,dCol:-1,kind:"shoot"},{dRow:-2,dCol:-2,kind:"shoot"},{dRow:-3,dCol:-3,kind:"shoot"},{dRow:-1,dCol:1,kind:"shoot"},{dRow:-2,dCol:2,kind:"shoot"},{dRow:-3,dCol:3,kind:"shoot"},{dRow:1,dCol:-1,kind:"shoot"},{dRow:2,dCol:-2,kind:"shoot"},{dRow:3,dCol:-3,kind:"shoot"},{dRow:1,dCol:1,kind:"shoot"},{dRow:2,dCol:2,kind:"shoot"},{dRow:3,dCol:3,kind:"shoot"}]},soldat:{id:"soldat",name:tt.soldat.name,symbol:"SO",roleSummary:tt.soldat.roleSummary,initialQuantity:be.soldat,maxBoardCapLabel:`${be.soldat} au départ (recrutable)`,movementSummary:"Avance d’1 case vers le camp adverse : tout droit (case libre uniquement) ou en diagonale avant gauche/droite.",attackSummary:"Élimine uniquement en diagonale avant (ne peut jamais éliminer tout droit).",specialAbility:"Promotion : en atteignant la dernière rangée adverse, est promu au choix (Guetteur H/D, Assassin, Cavalier, Berserker, ou Reine / Colosse / Traqueur / Exécuteur / Arbalétrier si votre exemplaire unique est déjà éliminé).",interactionsSummary:["Respecte le plafond strict de 1 exemplaire en jeu pour Reine, Colosse, Traqueur, Exécuteur et Arbalétrier.",`Un plateau complet démarre toujours à ${iu} pièces par camp.`],restrictions:["Ne peut jamais reculer (sauf carte Retreat).","Ne peut jamais être promu en Roi."],diagramMoves:[{dRow:-1,dCol:0,kind:"move_only"},{dRow:-1,dCol:-1,kind:"move_and_attack"},{dRow:-1,dCol:1,kind:"move_and_attack"}]}},cr={kamikaze:{id:"kamikaze",name:it.kamikaze.name,badge:"💥",durationLabel:"Permanent jusqu’à élimination",visibilityLabel:"Adversaire averti de la carte, pion cible secret",effectDescription:it.kamikaze.description,restrictions:["Interdit sur le Roi et sur le Colosse.",`Un Colosse survit au 1er déclenchement Kamikaze qu’il provoque (1/${ot}) et est éliminé au ${ot}e (${ot}/${ot}).`,"Les déclenchements Kamikaze provoqués par d’autres pièces ne comptent jamais dans le compteur du Colosse.","S’applique également contre Traqueur, Exécuteur (Frappe traversante incluse) et Arbalétrier à distance.","Une pièce attaquante protégée par Protection absorbe l’explosion Kamikaze en brisant sa Protection.","Si un Assassin meurt par Kamikaze, sa révélation permanente ne se déclenche pas."]},invincibilite:{id:"invincibilite",name:it.invincibilite.name,badge:"🛡️",durationLabel:"1 tour complet",visibilityLabel:"Adversaire averti de la carte, pion cible secret",effectDescription:it.invincibilite.description,restrictions:["Interdit sur le Roi et sur le Colosse.","Bloque toute attaque directe, saut de Cavalier, Frappe traversante ou Tir d’arbalète pendant 1 tour complet.","Aucune capacité spéciale (y compris l’Exécuteur ou le Traqueur) ne contourne l’Invincibilité."]},block:{id:"block",name:it.block.name,badge:"⛓️",durationLabel:"1 tour adverse sauté",visibilityLabel:"Effet annoncé publiquement",effectDescription:it.block.description,restrictions:["Temps de recharge (cooldown) de 2 tours avant de pouvoir rejouer Block.","Empêche également le Traqueur ou l’Arbalétrier adverse d’agir pendant le tour sauté ; votre propre tour suivant progresse normalement."]},retreat:{id:"retreat",name:it.retreat.name,badge:"↩️",durationLabel:"Immédiat",visibilityLabel:"Déplacement visible",effectDescription:it.retreat.description,restrictions:["Permet aux pièces ne pouvant normalement pas reculer (Soldat, Colosse) de reculer d’1 case (y compris Traqueur, Exécuteur, Arbalétrier).","L’élimination en reculant doit respecter les immunités (Colosse, Invincibilité) et le seuil Kamikaze du Colosse (2 déclenchements)."]},revelation_temporaire:{id:"revelation_temporaire",name:it.revelation_temporaire.name,badge:"👁️",durationLabel:"1 tour complet (jusqu’à votre prochain tour)",visibilityLabel:"Cible secrète",effectDescription:it.revelation_temporaire.description,restrictions:["Bloquée par Brouillard et Contre-espionnage.","Permet au Traqueur de marquer la pièce révélée, mais le marquage disparaît dès que la révélation temporaire expire."]},revelation_permanente:{id:"revelation_permanente",name:it.revelation_permanente.name,badge:"🔍",durationLabel:"Jusqu’à la fin de la partie",visibilityLabel:"Cible secrète",effectDescription:it.revelation_permanente.description,restrictions:["Ne peut jamais être annulée par Brouillard ni Contre-espionnage.","Une pièce révélée définitivement reste éligible au Marquage du Traqueur (tant que la ligne orthogonale 1–4 est dégagée)."]},resurrection:{id:"resurrection",name:it.resurrection.name,badge:"✨",durationLabel:"Immédiat",visibilityLabel:"Apparition visible en 1re rangée",effectDescription:it.resurrection.description,restrictions:["Interdit sur le Roi, la Reine et le Colosse.","Autorisée sur Traqueur, Exécuteur et Arbalétrier uniquement s’il n’en existe pas déjà 1 exemplaire vivant sur le plateau (plafond strict de 1).","La case d’apparition sur la première rangée doit être libre.","Une pièce promue avant son élimination conserve son rôle promu à la résurrection (et réinitialise marquage / récupération)."]},brouillard:{id:"brouillard",name:it.brouillard.name,badge:"🌫️",durationLabel:"3 tours complets",visibilityLabel:"Actif sur toute votre armée",effectDescription:it.brouillard.description,restrictions:["Bloque les Guetteurs H/D adverses, Révélation temporaire et Espionnage.","Empêche le Traqueur adverse de marquer vos pièces cachées et fait immédiatement disparaître tout marquage qui reposait sur une révélation temporaire ou un Guetteur.","N’annule pas les révélations permanentes déjà acquises ni celles de l’Assassin."]},espionnage:{id:"espionnage",name:it.espionnage.name,badge:"📡",durationLabel:"3 tours complets",visibilityLabel:"Adversaire averti de la carte, pions cibles secrets",effectDescription:it.espionnage.description,restrictions:["Traverse Contre-espionnage, mais reste bloqué par Brouillard.","Tant qu’Espionnage révèle une pièce ennemie, le Traqueur peut la marquer."]},teleportation:{id:"teleportation",name:it.teleportation.name,badge:"⚡",durationLabel:"Immédiat",visibilityLabel:"Déplacement visible",effectDescription:it.teleportation.description,restrictions:["Utilisable sur Traqueur, Exécuteur et Arbalétrier en respectant leurs directions autorisées (sans traverser d’obstacle ni capturer).","Ne réinitialise jamais le temps de récupération du tir de l’Arbalétrier et ne déclenche ni tir, ni Frappe traversante, ni Poursuite automatique."]},protection:{id:"protection",name:it.protection.name,badge:"🔰",durationLabel:"Permanent jusqu’au 1er coup subi",visibilityLabel:"Cible secrète pour l’adversaire",effectDescription:it.protection.description,restrictions:["Interdit sur le Roi et sur le Colosse.","Bloque une attaque directe, un saut de Cavalier, une Frappe traversante, un Tir d’arbalète ou une explosion Kamikaze, puis disparaît.","N’interagit pas avec les révélations d’identité ni avec le marquage du Traqueur."]},recrutement:{id:"recrutement",name:it.recrutement.name,badge:"📯",durationLabel:"Immédiat (1 fois max par partie)",visibilityLabel:"Apparition visible en 1re rangée",effectDescription:it.recrutement.description,restrictions:["Réservée strictement au Soldat (jamais utilisable sur Traqueur, Exécuteur ou Arbalétrier)."]},double_action:{id:"double_action",name:it.double_action.name,badge:"⏩",durationLabel:"Ce tour (2 actions immédiates)",visibilityLabel:"Effet annoncé",effectDescription:it.double_action.description,restrictions:["Interdit de jouer une 2e carte pendant les 2 actions.","Ne contourne pas la récupération du tir de l’Arbalétrier (1 tir max par séquence, même sous Double Action).","Ne permet ni d’ignorer les immunités du Colosse ni de doubler automatiquement les capacités spéciales au-delà de leurs conditions normales."]},piege:{id:"piege",name:it.piege.name,badge:"🕸️",durationLabel:"Reste posé jusqu’au déclenchement ; immobilise 1 tour",visibilityLabel:"Adversaire averti de la pose, case secrète",effectDescription:it.piege.description,restrictions:["Une fois posé sur une case libre, affecte les pièces des DEUX camps (y compris Traqueur, Exécuteur et Arbalétrier s’ils s’y déplacent) !","La Frappe traversante et le Tir d’arbalète ne déplacent pas l’attaquant sur la case cible."]},contre_espionnage:{id:"contre_espionnage",name:it.contre_espionnage.name,badge:"🕶️",durationLabel:"3 tours complets",visibilityLabel:"Cible secrète pour l’adversaire",effectDescription:it.contre_espionnage.description,restrictions:["Bloque Révélation temporaire et les Guetteurs (ce qui retire également le marquage du Traqueur si la pièce redevient cachée).","Ne bloque pas Espionnage, Révélation permanente ni la capacité de l’Assassin."]},sacrifice:{id:"sacrifice",name:it.sacrifice.name,badge:"🩸",durationLabel:"Immédiat",visibilityLabel:"Annoncé à l’adversaire",effectDescription:it.sacrifice.description,restrictions:["Réservée strictement au Soldat (jamais utilisable sur Traqueur, Exécuteur ou Arbalétrier).","Utilisable même avec 3 cartes en main et ne donne aucun point de pioche à l’adversaire."]}},Yo=[{id:"concept",title:"1. Plateau 9×9, Nouvelle Composition (27 Pièces) & Préparation",summary:`Deux armées identiques de ${iu} pièces (Rouge et Noir) s’affrontent sur 81 cases. Rouge commence toujours.`,bullets:[`Composition officielle (${iu} pièces) : 1 Roi, 1 Reine, 1 Colosse, ${be.cavalier} Cavaliers, ${be.berserker} Berserker, ${be.assassin} Assassins, ${be.guetteur_h} Guetteurs H, ${be.guetteur_d} Guetteurs D, ${be.traqueur} Traqueur, ${be.executeur} Exécuteur, ${be.arbaletrier} Arbalétrier, ${be.soldat} Soldats.`,"Placement libre sur vos 3 premières rangées en 90 s (complétion automatique si temps écoulé) ; pendule de 10 minutes par joueur.","Reine, Colosse, Traqueur, Exécuteur et Arbalétrier sont chacun limités strictement à 1 exemplaire vivant maximum sur le plateau (y compris après Promotion ou Résurrection).","Apparence personnalisable : par défaut en Rouge et Noir, chaque camp conserve une palette claire ou sombre nettement différenciée sur fond 100 % transparent et automatiquement adaptée au thème sélectionné, sans jamais révéler d’identité cachée."]},{id:"visibility",title:"2. Identités Cachées, Révélations, Guetteurs, Traqueur & Arbalétrier",summary:"Les positions sont publiques, mais l’identité des pièces adverses reste cachée par défaut et jamais divulguée indûment.",bullets:["Guetteurs H (3/camp : bougent en diagonale, détectent H/V) et Guetteurs D (3/camp : bougent H/V, détectent en diagonale) révèlent temporairement les ennemis à 1 case ; s’ils détectent une cible sur la ligne de l’Arbalétrier, son identité devient visible sans augmenter portée ni cadence.","Traqueur & révélations : le Traqueur possède une portée standard de 1–2 cases et ne peut marquer qu’une pièce ennemie DÉJÀ révélée (Guetteur, Révélation temporaire/permanente, Espionnage, Colosse révélé) à 1–4 cases orthogonales dégagées pour étendre sa Poursuite jusqu’à 4 cases. Si la cible redevient inconnue (Brouillard, Contre-espionnage, expiration), le marquage disparaît immédiatement.","Arbalétrier & cibles inconnues : l’Arbalétrier peut tirer sur une pièce ennemie cachée, mais un tir bloqué (Colosse, Invincibilité, Protection) ne révèle jamais son identité ; si elle est éliminée inconnue, le cimetière affiche « Pièce éliminée ».","L’Assassin révèle définitivement chaque pièce qu’il élimine (sauf s’il meurt simultanément par Kamikaze)."]},{id:"colosse-et-specials",title:"3. Règles Officielles du Colosse, Kamikaze (2/2) & Capacités Spéciales",summary:`Le Colosse possède une immunité renforcée mise à jour avec la règle définitive des ${ot} déclenchements Kamikaze et la Frappe traversante.`,bullets:[`Kamikaze contre Colosse : le Colosse survit au 1er déclenchement Kamikaze qu’il provoque (1/${ot}) et est ÉLIMINÉ au ${ot}e (${ot}/${ot}). Les déclenchements Kamikaze provoqués par d’autres pièces ne comptent pas.`,"Attaques contre le Colosse : Roi, Reine et autre Colosse l’éliminent normalement ; la Frappe traversante de l’Exécuteur peut l’éliminer s’il est visé derrière une autre pièce ennemie non-Colosse ; le Tir d’arbalète et toutes les attaques normales (y compris Poursuite du Traqueur et Bond/Saut du Cavalier) ne peuvent JAMAIS l’éliminer.","Frappe traversante (Exécuteur) : sur [Exécuteur, Ennemi 1, Ennemi 2] alignés H/V (Ennemi 1 ≠ Colosse), l’Exécuteur reste sur sa case et choisit Ennemi 1 (attaque normale) ou Ennemi 2 (Frappe traversante, Ennemi 1 reste intact).","Tir d’arbalète & recharge (1 tir / 3 tours) : 1 à 3 cases dans les 8 directions en ligne dégagée, ne déplace pas l’Arbalétrier, puis temps de recharge de 2 tours personnels d’attente (Tour 1 tir → Tour 2 attente → Tour 3 attente → Tour 4 prêt ; non réinitialisé par Téléportation ; non contourné par Double Action).","Cavalier reworké (Bond en « L » & Percée) : effectue soit un pas orthogonal d’1 case (H/V), soit un Bond en « L » (2×1) sautant par-dessus toute pièce ou piège intermédiaire, soit un Saut Percée style dames en chaîne par-dessus un ennemi adjacent."]},{id:"cards-and-turns",title:"4. Nouvelle Gestion des Tours, Cartes & Fin de Partie",summary:"0 ou 1 élimination = 1 action pour l’adversaire. 2+ éliminations dans un tour = Tour Bonus immédiat (1 déplacement, sans carte). Toutes les 3 éliminations ennemies, vous piochez 1 carte aléatoire (3 max en main).",bullets:["Gestion des tours unifiée (sans pénalité) : aucune pièce n’offre plus 2 actions gratuites à l’adversaire en cas d’échec (l’ancienne pénalité à 0 élimination du Cavalier est supprimée).","Tour Bonus (2+ éliminations) : toute action ou combinaison d’actions dans un même tour éliminant au moins 2 pièces ennemies réelles accorde immédiatement un Tour Bonus d’1 seul déplacement sans carte (une attaque bloquée ou annulée ne compte jamais).","Kamikaze, Protection et Invincibilité sont strictement interdits sur le Roi et sur le Colosse ; Protection/Invincibilité bloquent aussi Frappe traversante et Tir d’arbalète.","Double Action accorde 2 actions consécutives dans ce tour (sans 2e carte ni 2e tir d’Arbalétrier) ; Téléportation respecte les directions de chaque pion.","Victoire immédiate par élimination du Roi adverse (y compris par Frappe traversante ou Tir d’arbalète), pendule à 0:00, abandon ou déconnexion > 60 s.","Match nul par accord mutuel, Pat (aucun coup ni carte jouable) ou 5 répétitions (avertissement à 3 répétitions)."]}],dv=[{id:"gestion-tours-bonus",title:"Gestion des Tours (0 = 1, 1 = 1, 2+ = Tour Bonus)",badge:"⚡",category:"Gestion des tours",summary:"La pénalité du Cavalier est supprimée. Le rythme des tours dépend désormais uniquement du nombre réel d’éliminations ennemies obtenues dans votre tour.",rules:["0 élimination réelle dans le tour : l’adversaire reçoit normalement 1 action à son tour.","1 élimination réelle dans le tour : l’adversaire reçoit normalement 1 action à son tour.","2 éliminations réelles ou plus dans un même tour (saut en chaîne, Double Action, combo) : vous obtenez immédiatement un Tour Bonus composé uniquement d’1 déplacement, sans carte autorisée."],edgeCases:["Une élimination bloquée par Protection, Invincibilité ou immunité du Colosse n’est pas comptabilisée.","Sacrifier son propre Soldat (carte Sacrifice) ou subir une riposte Kamikaze ne compte jamais comme une élimination vers votre Tour Bonus.","Un Tour Bonus ne peut jamais enchaîner un deuxième Tour Bonus."]},{id:"cavalier-rework",title:"Rework du Cavalier (Bond en « L » & Percée en Chaîne)",badge:"CAV",relatedCharacter:"cavalier",category:"Cavalier",summary:"Le Cavalier quitte son rôle rigide de pion lent puni à 0 élimination pour devenir une pièce d’infiltration agile capable de contourner le front en « L » ou de percer en chaîne.",rules:["Bond en « L » : se déplace ou attaque en L (2 cases sur un axe + 1 case perpendiculaire) en sautant par-dessus alliés, ennemis, Colosse et pièges intermédiaires.","Pas de mêlée : peut aussi avancer ou capturer à 1 case horizontale/verticale (H/V), mais pas à 1 case en diagonale.","Percée (Saut style dames) : peut toujours sauter par-dessus un ennemi adjacent vers la case libre située derrière lui, avec enchaînement facultatif (et déclencher le Tour Bonus à 2+ éliminations)."],edgeCases:["Aucune pénalité en cas de 0 élimination : déplacer un Cavalier sans capturer rend toujours 1 action normale à l’adversaire.","Un Piège posé sur la case d’arrivée d’un Bond en « L » s’active normalement ; les cases survolées sont ignorées.","Ne peut ni s’arrêter sur une case alliée ni éliminer un Colosse (il peut toutefois passer par-dessus un Colosse lors d’un Bond en « L »)."]},{id:"frappe-traversante",title:"Frappe traversante (Exécuteur)",badge:"EXE",relatedCharacter:"executeur",category:"Exécuteur",summary:"Permet à l’Exécuteur d’abattre une pièce ennemie située à 2 cases derrière un premier ennemi aligné H/V, en choisissant librement sa cible.",rules:["Alignement horizontal ou vertical obligatoire sur exactement 2 cases : [Exécuteur] → [Ennemi 1] → [Ennemi 2].","L’Exécuteur reste sur sa case de départ et élimine Ennemi 2 à travers la ligne ; Ennemi 1 reste intact.","Si vous préférez abattre Ennemi 1, sélectionnez simplement la case à 1 case (attaque normale).","Seule capacité spéciale autorisée à éliminer le Colosse (lorsqu’il est la cible arrière Ennemi 2)."],edgeCases:["Impossible à travers une pièce alliée, à travers 2 pièces, ou si Ennemi 1 est un Colosse (un Colosse intermédiaire caché interrompt la frappe et est révélé temporairement).","Si Ennemi 1 est le Roi adverse, frapper Ennemi 2 laisse le Roi intact ; choisir directement le Roi gagne immédiatement la partie.","Respecte Protection, Invincibilité et Kamikaze (si Ennemi 2 explose en Kamikaze, l’Exécuteur est emporté sauf Protection)."]},{id:"marquage-poursuite",title:"Marquage & Poursuite (Traqueur — Guide Détaillé)",badge:"TRQ",relatedCharacter:"traqueur",category:"Traqueur",summary:"Portée de base de 2 cases H/V ; cibler gratuitement (0 coût) un ennemi déjà révélé sur l’échiquier étend la Poursuite jusqu’à 4 cases vers cette cible.",rules:["Objectif & Conditions : ciblez une pièce ennemie DÉJÀ révélée (Guetteur H/D, Espionnage, Révélation temporaire/permanente, Colosse révélé) située à 1–4 cases orthogonales en ligne dégagée (aucune pièce inconnue « ? »).","Activation sur l’échiquier : sélectionnez le Traqueur → cliquez sur « Cibler (0 PA) » → cliquez directement sur l’ennemi révélé sur l’échiquier (alignement H/V, 1–4 cases).","Déplacements & Bonus Poursuite : normalement 1–2 cases H/V. Dès que la cible est traquée (et tant que la marque reste valide), votre portée vers elle monte jusqu’à 4 cases H/V.","Exemple concret : votre Guetteur révèle un Assassin adverse à 4 cases de votre Traqueur en ligne dégagée. Vous cliquez « Cibler » puis cliquez l’Assassin sur l’échiquier (0 action) : votre Traqueur peut maintenant bondir jusqu’à 4 cases pour l’éliminer !"],edgeCases:["Limites strictes : une seule cible marquée maximum ; à distance 3 ou 4, impossible d’éliminer une autre pièce que la cible marquée.","Durée & Fin d’effet : persiste tant que la cible est en vie et identifiable ; consomme le bonus quand vous effectuez un déplacement de 3 ou 4 cases (un déplacement de 1–2 cases conserve le marquage).","Disparition immédiate : si la cible meurt ou redevient cachée (expiration de Révélation temporaire/Espionnage, sortie d’un Guetteur, Brouillard, Contre-espionnage), le marquage disparaît.","Colosse & Cartes : le Colosse révélé peut être marqué pour se rapprocher rapidement, mais la Poursuite ne l’élimine jamais ; respecte Protection, Invincibilité et Kamikaze ; Téléportation n’annule pas le marquage."]},{id:"tir-arbalete",title:"Tir d’arbalète (Arbalétrier)",badge:"ARB",relatedCharacter:"arbaletrier",category:"Arbalétrier",summary:"Attaque à distance sur 1 à 3 cases dans les 8 directions, avec ligne de vue dégagée, sans déplacer l’Arbalétrier.",rules:["Portée : 1, 2 ou 3 cases horizontalement, verticalement ou en diagonale, sans aucune pièce sur les cases intermédiaires.","Action complète : tirer consomme votre action du tour (impossible de bouger et tirer dans la même action).","Cible inconnue autorisée : le tir peut viser une pièce ennemie cachée (« ? ») ; si elle est éliminée, le cimetière affiche « Pièce éliminée »."],edgeCases:["Si une pièce se trouve à 1 case orthogonale (adjacente), l’interface vous permet de choisir entre Capture au corps à corps (déplacement) et Tir d’arbalète à distance (reste sur place).","Un tir bloqué par Protection, Invincibilité ou Colosse ne révèle JAMAIS l’identité d’une cible inconnue."]},{id:"recuperation-tir",title:"Recharge du Tir de l’Arbalétrier (1 tir / 3 tours personnels)",badge:"ARB",relatedCharacter:"arbaletrier",category:"Arbalétrier",summary:"Après chaque tir (réussi ou bloqué), l’Arbalétrier ne peut tirer qu’une fois tous les 3 tours de son propriétaire : 2 tours personnels d’attente obligatoires avant le prochain tir.",rules:["Cycle exact : Tour 1 (Disponible → vous tirez) → Tour 2 (Indisponible : 2 tours restants) → Tour 3 (Indisponible : 1 tour restant) → Tour 4 (Disponible à nouveau !).","Les tours de l’adversaire ne font jamais avancer ce délai ; seul le déplacement normal d’1 case H/V reste autorisé pendant la recharge.","Le délai s’applique même si le tir a été bloqué par Invincibilité, Protection ou un Colosse."],edgeCases:["Double Action : ne permet jamais de tirer deux fois ni de contourner la recharge (la 2e action sert à bouger l’Arbalétrier ou une autre pièce).","Téléportation & Block : Téléportation ne réinitialise jamais le temps de recharge ; l’état de recharge est strictement géré côté serveur et restauré après reconnexion."]},{id:"interactions-colosse",title:"Interactions avec le Colosse",badge:"CO",relatedCharacter:"colosse",category:"Colosse & Kamikaze",summary:"Récapitulatif officiel de toutes les capacités spéciales face à l’immunité du Colosse.",rules:["Éliminations directes autorisées : Roi, Reine, autre Colosse et Frappe traversante de l’Exécuteur (lorsque le Colosse est la cible arrière).","Attaques inefficaces : Tir d’arbalète, Poursuite/attaque du Traqueur, attaque normale 1–2 cases de l’Exécuteur, Cavalier (Bond/Saut), Berserker, Assassin, Guetteurs, Soldat.","Pièce intermédiaire : le Colosse ne peut jamais être sauté par le Saut Percée style dames du Cavalier ni traversé par la Frappe traversante ; le Cavalier peut toutefois passer par-dessus lors d’un Bond en « L »."],edgeCases:["Une attaque de mêlée, un Bond offensif sur lui ou un saut de Cavalier contre un Colosse caché échoue et le révèle temporairement.","Au contraire, un Tir d’arbalète contre un Colosse caché échoue SANS révéler son identité."]},{id:"kamikaze-colosse",title:`Kamikaze contre le Colosse (${ot}/${ot})`,badge:"💥",category:"Colosse & Kamikaze",summary:`Règle définitive : le Colosse est éliminé au ${ot}e déclenchement de Kamikaze qu’il provoque lui-même.`,rules:[`1er déclenchement provoqué par le Colosse : la pièce Kamikaze explose, le Colosse SURVIT (compteur à 1/${ot}).`,`2e déclenchement provoqué par ce même Colosse : le Colosse est ÉLIMINÉ à son tour (${ot}/${ot}).`,"Les explosions Kamikaze déclenchées par d’autres pièces alliées ou ennemies n’incrémentent jamais le compteur du Colosse."],edgeCases:["Le compteur (0/2, 1/2) est propre à chaque Colosse, conservé entre les tours et après reconnexion, et strictement calculé par le serveur.","Le Roi et le Colosse ne peuvent jamais recevoir eux-mêmes les cartes Kamikaze, Protection ou Invincibilité."]}],yh=[{id:"faq-hidden-identities",category:"regles",question:"Pourquoi les pions adverses affichent-ils « Inconnu » sur le plateau ?",answer:"BLIND WAR est un jeu à informations cachées : vous connaissez uniquement l’identité de vos propres pièces. Pour révéler l’ennemi, utilisez vos Guetteurs H/D, l’Assassin (révèle sa victime), ou des cartes comme Espionnage et Révélation."},{id:"faq-piece-colors",category:"themes_profil",question:"Comment s’adaptent les couleurs des pièces selon le thème choisi ?",answer:"Chaque thème applique automatiquement une palette harmonieuse claire pour un camp et foncée/contrastée pour l’autre sur un fond 100 % transparent, afin que chaque silhouette reste immédiatement lisible sur les cases claires, foncées, sélectionnées ou visées sans jamais changer de camp."},{id:"faq-themes-sync",category:"themes_profil",question:"Mon adversaire voit-il le thème que j’ai choisi ?",answer:"Non. Le thème (Rouge et noir, Vert et beige, Noir et blanc, Bleu et argent, etc.) est une préférence strictement personnelle : chaque joueur affiche l’interface et le plateau avec son propre thème."},{id:"faq-arb-cooldown",category:"pions_cartes",question:"Comment fonctionne le temps de recharge de l’Arbalétrier ?",answer:"L’Arbalétrier peu ernière rangée adverse",verdictBadge:"CAPACITÉ",explanation:"Arrivé tout au bout, le Soldat devient au choix une pièce d’élite disponible.",rows:5,cols:5,pieces:[{row:1,col:2,kind:"soldat",owner:"red"}],highlights:[{row:1,col:2,kind:"selected"},{row:0,col:2,kind:"mark",tag:"PROMOTION !"}],arrows:[{from:{row:1,col:2},to:{row:0,col:2},kind:"move"}]}]}},fv=[{id:"regles_generales",label:"Règles générales",icon:"📜",summary:"Plateau 9×9, placement secret initial des 27 pièces, objectif Roi et pendule."},{id:"presentation_pieces",label:"Présentation des pièces",icon:"♟️",summary:"Fiches détaillées et interactives pour chacune des 12 unités de BlindWar."},{id:"deplacements",label:"Déplacements",icon:"🧭",summary:"Règles exactes de trajectoires, sauts du Cavalier, restrictions et obstacles."},{id:"attaques_captures",label:"Attaques et captures",icon:"⚔️",summary:"Corps à corps, diagonale du Soldat, Tir d’arbalète, Frappe traversante et Armure."},{id:"regles_speciales",label:"Règles spéciales",icon:"✨",summary:"Identités cachées, Guetteurs, Marquage Traqueur, Colosse, Promotions et 16 Cartes."},{id:"situations_particulieres",label:"Situations particulières",icon:"⚖️",summary:"Tour Bonus 2+ éliminations, Kamikaze 2/2, Invincibilité/Protection, Répétition x5 et Pat."},{id:"strategies_conseils",label:"Stratégies et conseils",icon:"🧠",summary:"Couverture de reconnaissance, gestion du Brouillard, leurres du Roi et tempo."},{id:"exemples_parties",label:"Exemples de parties",icon:"🎓",summary:"Scénarios jouables guidés pour pratiquer chaque mécanique sur le véritable plateau."}],Xo=[{id:"rule-visibility-hierarchy",category:"regles_speciales",badge:"👁️",title:"Hiérarchie des Révélations (Guetteurs, Assassin, Brouillard & Espionnage)",summary:"Toutes les sources de révélation et de camouflage suivent un ordre de priorité strict côté serveur.",relatedCharacterIds:["guetteur_h","guetteur_d","assassin"],relatedCards:["revelation_temporaire","revelation_permanente","espionnage","contre_espionnage","brouillard"],linkedScenarioId:"recon-guetteurs",howItWorksSteps:["1. Proximité (Guetteur H en H/V, Guetteur D en diagonale à 1 case) : révélation temporaire tant que le Guetteur reste vivant adjacent.","2. Révélation temporaire (carte 👁️ ou attaque ratée sur Colosse) : dure 1 tour complet.","3. Contre-espionnage (🕶️ sur 1 pièce, 3 tours) : bloque Guetteurs et Révélation temporaire.","4. Espionnage (📡 jusqu’à 2 ennemis, 3 tours) : PERCE le Contre-espionnage.","5. Brouillard (🌫️ toute votre armée, 3 tours) : bloque Guetteurs, Révélation temporaire ET Espionnage.","6. Révélation définitive (Assassin tuant sa victime ou carte 🔍) : JAMAIS annulée, ni par Brouillard ni par Contre-espionnage."],whenToUse:"Activez Brouillard pour casser un Marquage du Traqueur adverse ou masquer un siège devant vos lignes.",conditions:["Chaque niveau supérieur neutralise ou contourne exactement les niveaux inférieurs selon l’ordre officiel."],limits:["Un Guetteur H ne révèle que H/V (1 case) ; il ne traverse ni les cases vides au-delà de 1 case ni Brouillard."],examples:["L’ennemi lance Contre-espionnage sur sa Reine puis croit être intouchable : votre carte Espionnage passe à travers et la révèle aussitôt pour votre Traqueur."],consequences:["Dès qu’une cible redevient masquée (expiration ou Brouillard), tout marquage actif du Traqueur sur elle disparaît immédiatement."],demoSteps:[{id:"vis-demo-1",stepTitle:"1. Guetteur H + Guetteur D dévoilent en croix et en diagonale",verdictBadge:"CAPACITÉ",explanation:"Un pion ennemi entrant dans le rayon orthogonal du Guetteur H ou diagonal du Guetteur D est immédiatement identifié.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_h",owner:"red"},{row:1,col:2,kind:"reine",owner:"black"},{row:2,col:3,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:2,kind:"recon",tag:"Reine vue!"},{row:2,col:3,kind:"recon",tag:"Identifié"},{row:3,col:2,kind:"recon"},{row:2,col:1,kind:"recon"}]},{id:"vis-demo-2",stepTitle:"2. Brouillard / Contre-espionnage recouvre la pièce temporairement",verdictBadge:"INTERDIT",explanation:"Sous Brouillard ou Contre-espionnage, l’ennemi redevient « ? » face aux Guetteurs et le Traqueur perd sa marque.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"guetteur_h",owner:"red"},{row:1,col:2,kind:"secret",owner:"black"}],highlights:[{row:2,col:2,kind:"selected"},{row:1,col:2,kind:"forbidden",tag:"Brouillard"}]}]},{id:"rule-colosse-kamikaze",category:"regles_speciales",badge:"💥",title:`Colosse : Armure, Bascule d’extrémité & Règle des ${ot} Kamikazes`,summary:`Le Colosse résiste aux attaques normales et à l’Arbalétrier, mais tombe après ${ot} déclenchements de Kamikaze qu’il provoque lui-même.`,relatedCharacterIds:["colosse"],relatedCards:["kamikaze","protection","invincibilite"],linkedScenarioId:"kamikaze-colosse-v2",howItWorksSteps:["1. Progression : 5 directions vers l’avant/côtés ; arrivé tout au bout du plateau, il inverse son sens et reste révélé 1 tour complet.","2. Seuls Roi, Reine, autre Colosse et la Frappe traversante de l’Exécuteur (en cible arrière) le tuent directement.",`3. Au 1er ennemi sous Kamikaze abattu par ce Colosse : le Kamikaze explose, le Colosse SURVIT à 1/${ot}.`,`4. Au ${ot}e ennemi sous Kamikaze abattu par ce même Colosse : le Colosse est ÉLIMINÉ (${ot}/${ot}).`],whenToUse:"Placez deux cartes Kamikaze sur les pions situés sur le chemin d’un Colosse adverse hors de portée de votre Reine.",conditions:["Le compteur n’augmente QUE pour les explosions Kamikaze déclenchées par le Colosse en attaquant lui-même."],limits:["Un Kamikaze déclenché contre une autre pièce que le Colosse n’avance JAMAIS le compteur du Colosse.","Le Colosse ne peut jamais recevoir Kamikaze, Protection, Invincibilité ni Résurrection."],examples:["Votre Colosse mange un Soldat Kamikaze (compteur 1/2, survit), puis deux tours plus tard capture un Guetteur Kamikaze (compteur 2/2, éliminé)."],consequences:["Le compteur (0/2, 1/2) est persisté côté serveur et affiché dans le panneau gauche du propriétaire."],demoSteps:[{id:"col-kam-1",stepTitle:"Étape 1 : 1er Kamikaze provoqué par le Colosse → Survie (1/2)",verdictBadge:"CAPACITÉ",explanation:"L’ennemi Kamikaze explose mais le Colosse encaisse le choc et passe son compteur à 1/2.",rows:5,cols:5,pieces:[{row:3,col:2,kind:"colosse",owner:"red"},{row:2,col:2,kind:"soldat",owner:"black"}],highlights:[{row:3,col:2,kind:"selected",tag:"0/2 → 1/2"},{row:2,col:2,kind:"attack",tag:"Kamikaze 1"}],arrows:[{from:{row:3,col:2},to:{row:2,col:2},kind:"attack"}]},{id:"col-kam-2",stepTitle:"Étape 2 : 2e Kamikaze provoqué par le Colosse → Élimination (2/2)",verdictBadge:"EXEMPLE",explanation:"Déjà entamé à 1/2, le Colosse ne survit pas à une seconde explosion Kamikaze et disparaît du plateau.",rows:5,cols:5,pieces:[{row:2,col:2,kind:"colosse",owner:"red"},{row:1,col:2,kind:"berserker",owner:"black"}],highlights:[{row:2,col:2,kind:"selected",tag:"1/2 → 2/2 KO"},{row:1,col:2,kind:"attack",tag:"Kamikaze 2"}],arrows:[{from:{row:2,col:2},to:{row:1,col:2},kind:"attack"}]}]},{id:"rule-traqueur-marquage",category:"regles_speciales",badge:"🎯",title:"Ciblage sur l’échiquier (0 action) & Poursuite à 4 cases (Traqueur)",summary:"Portée de base de 2 cases H/V ; cibler gratuitement sur l’échiquier un ennemi déjà identifié étend la Poursuite jusqu’à 4 cases.",relatedCharacterIds:["traqueur"],linkedScenarioId:"traqueur-marquage-poursuite",howItWorksSteps:["1. Portée de base : le Traqueur se déplace et capture à 1 ou 2 cases orthogonalement sans obstacle.","2. Vérifiez qu’un ennemi est DÉJÀ révélé et aligné H/V à 1–4 cases de votre Traqueur sans obstacle.","3. Sélectionnez votre Traqueur → cliquez sur « Cibler (0 PA) » → cliquez directement sur l’ennemi révélé sur l’échiquier : la marque est posée gratuitement, vous gardez toute votre action du tour.","4. Dès que la cible est traquée, la portée vers la direction qui rapproche de la cible augmente jusqu’à 4 cases H/V."],whenToUse:"Dès qu’un Guetteur ou Espionnage dévoile une pièce majeure ennemie alignée jusqu’à 4 cases de votre Traqueur.",conditions:["Cible strictement déjà révélée (jamais « ? »), alignée orthogonalement (1–4 cases) et sans obstacle."],limits:["Sans cible traquée, la portée reste strictement bloquée à 2 cases H/V.","À distance 3 ou 4, impossible d’éliminer une autre pièce que la cible marquée (et jamais un Colosse).","Si la cible redevient masquée ou meurt, le marquage disparaît instantanément."],examples:["Vous ciblez une Reine ennemie révélée à 4 cases sur l’échiquier (0 PA) — votre Traqueur fond immédiatement sur 4 cases et l’abat."],consequences:["Le déplacement à distance 3 ou 4 consomme le marquage ; un trajet de 1–2 cases ou une Téléportation le conserve actif."],demoSteps:Mn.traqueur.demoSteps},{id:"rule-executeur-piercing",category:"attaques_captures",badge:"🪓",title:"Frappe traversante de l’Exécuteur",summary:"Frappe à exactement 2 cases derrière une pièce ennemie écran sans toucher la première pièce — perce même le Colosse.",relatedCharacterIds:["executeur"],linkedScenarioId:"executeur-frappe-traversante",howItWorksSteps:["1. Alignement orthogonal exact requis : [Exécuteur] → [Ennemi 1 (≠ Colosse)] → [Ennemi 2].","2. Cliquez sur la case d’Ennemi 2 : choisissez « Frappe traversante » si un choix s’affiche.","3. L’Exécuteur reste sur sa case de départ ; Ennemi 1 reste intact sur sa case ; Ennemi 2 est éliminé !"],whenToUse:"Quand l’adversaire protège son Colosse ou son Roi derrière un simple Soldat aligné devant votre Exécuteur.",conditions:["Exactement 1 pièce ennemie non-Colosse entre l’Exécuteur et la cible arrière sur la même ligne/colonne."],limits:["Impossible à travers une pièce alliée, à travers 2 pièces ou si l’écran est un Colosse (un Colosse écran cache/bloque la frappe et est révélé 1 tour)."],examples:["Exécuteur en D3, Soldat ennemi en D4, Roi (ou Colosse) ennemi en D5 : cliquez D5 pour gagner ou abattre le Colosse sans déplacer D3 !"],consequences:["Si Ennemi 2 porte Kamikaze, son explosion atteint l’Exécuteur (sauf Protection) ; si Ennemi 2 porte Protection, sa Protection se brise."],demoSteps:Mn.executeur.demoSteps},{id:"rule-arbaletrier-cadence",category:"attaques_captures",badge:"🏹",title:"Tir à distance & Cadence (1 tir / 3 tours personnels)",summary:"Tir sur 1–3 cases dans les 8 directions suivi de 2 tours personnels d’attente obligatoire.",relatedCharacterIds:["arbaletrier"],linkedScenarioId:"arbaletrier-tir-cadence",howItWorksSteps:["1. Tour 1 (Prêt) : visez une cible ennemie en ligne dégagée à 1, 2 ou 3 cases (8 directions) ; l’Arbalétrier ne se déplace pas.","2. Tour 2 personnel : Tir indisponible (2 tours d’attente restants) — seul le pas d’1 case H/V est autorisé.","3. Tour 3 personnel : Tir indisponible (1 tour d’attente restant).","4. Tour 4 personnel : Le tir redevient disponible automatiquement !"],whenToUse:"Pour éliminer à distance sans subir de Piège sur la case ciblée ni bouger votre ligne de défense.",conditions:["Ligne de visée totalement dégagée entre l’Arbalétrier et la cible."],limits:["Les tours de l’adversaire ne font jamais avancer la recharge.","Double Action ne permet jamais de tirer 2 fois ; Téléportation ne réinitialise jamais le compteur.","Ne tue jamais le Colosse et ne révèle pas un Colosse inconnu s’il bloque le tir."],examples:["Après un tir bloqué par Protection au Tour 1, la recharge démarre tout de même (2 tours d’attente)."],consequences:["Si la cible abattue à distance porte Kamikaze, l’explosion emporte aussi l’Arbalétrier (sauf Protection)."],demoSteps:Mn.arbaletrier.demoSteps},{id:"rule-cavalier-mobility",category:"deplacements",badge:"🐴",title:"Cavalier : Bond en « L » & Saut Percée sans pénalité",summary:"Triple mobilité orthogonale/équestre permettant de sauter les obstacles et de déclencher un Tour Bonus à 2+ éliminations.",relatedCharacterIds:["cavalier"],linkedScenarioId:"cavalier-bond-et-percee",howItWorksSteps:["1. Choisissez soit un pas simple de 1 case H/V, soit un Bond en « L » (2×1), soit un Saut Percée style dames au-dessus d’un ennemi adjacent vers la case vide derrière.","2. Pendant un Bond en « L », vous survolez toutes les pièces (même le Colosse) et tous les pièges intermédiaires sans les déclencher.","3. Pendant un Saut Percée, chaque ennemi sauté est éliminé et vous pouvez enchaîner ou cliquer « Terminer les sauts »."],whenToUse:"Pour briser une défense verrouillée en début de partie sans aucun risque de pénalité en cas de coup pacifique.",conditions:["Pour le Saut Percée, la case de réception immédiatement derrière l’ennemi doit être libre et l’ennemi sauté ne doit pas être un Colosse."],limits:["Plus de déplacement d’1 case en diagonale.","Ne peut tuer aucun Colosse directement."],examples:["Double Saut Percée dans un même tour : 2 ennemis éliminés → Tour Bonus immédiat de 1 mouvement supplémentaire !"],consequences:["Seule la case d’arrivée d’un Bond en « L » peut déclencher un Piège."],demoSteps:Mn.cavalier.demoSteps},{id:"rule-promotion-cap",category:"regles_speciales",badge:"👑",title:"Promotion du Soldat & Plafond strict de 1 exemplaire",summary:"Tout Soldat parvenu sur la dernière rangée ennemie se transforme selon les plafonds actifs de votre armée.",relatedCharacterIds:["soldat"],linkedScenarioId:"pions-et-promotion",howItWorksSteps:["1. Amenez un Soldat sur la dernière rangée du camp adverse (rangée 9 pour Rouge, rangée 1 pour Noir).","2. Le moteur ouvre la fenêtre de promotion dès la fin du coup.","3. Choisissez parmi Guetteur H/D, Assassin, Cavalier, Berserker — et parmi Reine, Colosse, Traqueur, Exécuteur, Arbalétrier uniquement si votre exemplaire initial est déjà mort."],whenToUse:"Dès qu’un couloir s’ouvre, particulièrement pour ressusciter tactiquement votre Reine ou votre Exécuteur tombé.",conditions:["Le Roi et le Soldat ne sont jamais sélectionnables en promotion.","Les pièces uniques respectent toujours un plafond strict d’1 vivant sur le plateau."],limits:["Si votre Colosse est promu sur la rangée finale, son sens initial p
